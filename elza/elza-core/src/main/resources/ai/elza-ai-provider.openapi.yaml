              schema:
                $ref: '#/components/schemas/ServiceError'
        '500':
          description: |-
            Standard error payload. Notable statuses: `402` — no active subscription or
            quota exhausted (the body's `code` distinguishes, e.g. `NO_SUBSCRIPTION`,
            `QUOTA_EXCEEDED`); `409` — the operation does not fit the task's current state
            (e.g. tool results for a task not in `awaiting_tools`); `429` — rate limited,
            retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceError'
      tags:
        - ElzaAi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                results:
                  type: array
                  items:
                    $ref: '#/components/schemas/ToolResult'
                  description: One result per pending tool call.
              required:
                - results
security:
  - SignatureAuth: []
components:
  parameters:
    SignedRequest:
      name: X-AI-Date
      in: header
      required: true
      description: |-
        Request creation time (UTC, ISO 8601 / RFC 3339); part of the signature,
        within ±2 min of server time.
      schema:
        type: string
        format: date-time
  schemas:
    AiServiceInfo:
      type: object
      required:
        - protocolVersion
        - taskTypes
        - profiles
        - limits
      properties:
        protocolVersion:
          type: string
          description: |-
            Protocol version, `major.minor`. Minor grows additively; a major bump (not
            planned) would be a new base path.
        providerName:
          type: string
          description: Human-readable name of the provider/service.
        taskTypes:
          type: array
          items:
            $ref: '#/components/schemas/TaskTypeInfo'
          description: Task types this provider supports.
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileInfo'
          description: Quality/cost tiers this provider offers.
        limits:
          allOf:
            - $ref: '#/components/schemas/Limits'
          description: Operational limits.
      additionalProperties: {}
      description: |-
        Capabilities of this provider. Also serves as the "test connection" call:
        a `200` proves reachability, authentication and an active subscription.
    Limits:
      type: object
      properties:
        maxInputBytes:
          type: integer
          format: int64
          description: Maximum size of a serialized `SubmitTask` body, in bytes.
        maxToolResultBytes:
          type: integer
          format: int64
          description: Maximum size of a serialized tool-results body, in bytes.
        maxWaitSeconds:
          type: integer
          format: int32
          description: Maximum accepted `wait` value on task polling, in seconds.
        maxOpenTasks:
          type: integer
          format: int32
          description: Maximum number of a subscriber's tasks in a non-terminal state at once.
        toolResultTimeoutSeconds:
          type: integer
          format: int32
          description: Seconds a task may spend in `awaiting_tools` before failing with `TOOL_TIMEOUT`.
        taskRetentionDays:
          type: integer
          format: int32
          description: |-
            Days a finished task (and its result) stays retrievable. Conversation
            payloads are deleted after this window; only usage/accounting metadata is
            kept longer.
      description: Operational limits of this provider. Advisory for clients; enforced server-side.
    PingResponse:
      type: object
      required:
        - status
        - serverTime
      properties:
        status:
          type: string
          enum:
            - ok
          description: Always `ok` — a `200` with this body proves the endpoint is alive.
        serverTime:
          type: string
          format: date-time
          description: |-
            Current server time (UTC). Compare with the local clock to diagnose
            signature failures caused by clock skew — `X-AI-Date` must be within
            ±2 minutes of this value for signed requests to be accepted.
      description: Liveness probe response.
    ProfileInfo:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Profile code to pass in `SubmitTask.profile`, e.g. `standard`.
        name:
          type: string
          description: Human-readable name.
        description:
          type: string
          description: What the tier offers (quality, speed, price class).
        default:
          type: boolean
          description: True for the profile used when a submission names none.
      description: A quality/cost tier offered by this provider.
    ServiceError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable message.
      description: |-
        Standard error payload. Notable statuses: `402` — no active subscription or
        quota exhausted (the body's `code` distinguishes, e.g. `NO_SUBSCRIPTION`,
        `QUOTA_EXCEEDED`); `409` — the operation does not fit the task's current state
        (e.g. tool results for a task not in `awaiting_tools`); `429` — rate limited,
        retry later.
    SignatureAuth:
      type: object
      required:
        - type
        - in
        - name
      properties:
        type:
          type: string
          enum:
            - apiKey
          description: API key authentication
        in:
          type: string
          enum:
            - header
          description: location of the API key
        name:
          type: string
          enum:
            - Authorization
          description: name of the API key
      description: ELZA-AI-HMAC-SHA256 request signature carried in the `Authorization` header (the secret is never sent). See the API description and security.md for the canonical string and KeyId scoping.
    SubmitTask:
      type: object
      required:
        - requestId
        - taskType
        - input
        - outputSchema
      properties:
        requestId:
          type: string
          description: |-
            Client-generated idempotency key (e.g. a UUID). Retrying a failed submit with
            the same `requestId` never creates a second task: the server replies with the
            existing task and `duplicate: true`.
        taskType:
          allOf:
            - $ref: '#/components/schemas/TaskType'
          description: The AI capability requested; selects the provider-side prompt and the price.
        profile:
          type: string
          description: |-
            Quality/cost tier, e.g. `standard`. Available profiles are listed by
            `GET /info`; omitted means the provider's default.
        userInstructions:
          type: string
          description: |-
            Free-form instructions from the *user* (not the integrating application) —
            e.g. the inquiry text, or how content should be reformatted. Composed by the
            provider with its own prompt for the task type.
        input:
          description: Task-type-specific input payload (the data to work on).
        outputSchema:
          type: object
          additionalProperties: {}
          description: |-
            JSON Schema the `output` must validate against. Owned by the client (it is
            what the client's code parses); the provider guarantees conformance of
            `output`.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolDefinition'
          description: |-
            Tools the client offers for this task. If present, the task may enter
            `awaiting_tools` and request calls; if absent, the task runs on `input` alone.
        parentTaskId:
          type: string
          description: |-
            Id of a finished task whose conversation this task continues (a follow-up /
            refinement). The provider restores that task's context server-side; the
            client does not re-send it. The parent must belong to the same subscriber
            and be within the retention window.
        metadata:
          allOf:
            - $ref: '#/components/schemas/TaskMetadata'
          description: Client-supplied context for audit and reporting.
      description: Task submission.
    Task:
      type: object
      required:
        - taskId
        - requestId
        - taskType
        - state
        - createdAt
      properties:
        taskId:
          type: string
          description: Server-assigned task id (opaque).
        requestId:
          type: string
          description: The client's idempotency key from the submission.
        taskType:
          allOf:
            - $ref: '#/components/schemas/TaskType'
          description: Requested capability.
        state:
          allOf:
            - $ref: '#/components/schemas/TaskState'
          description: Current state. Unknown values must be treated as "in progress".
        createdAt:
          type: string
          format: date-time
          description: When the task was accepted.
        startedAt:
          type: string
          format: date-time
          description: When processing began (absent while `queued`).
        finishedAt:
          type: string
          format: date-time
          description: When the task reached a terminal state.
        progress:
          allOf:
            - $ref: '#/components/schemas/TaskProgress'
          description: Advisory progress for user display.
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: |-
            Pending tool calls; present exactly while `awaiting_tools`. Answer all of
            them in one `POST …/tool-results`.
        output:
          description: |-
            The result; present when `done`. Validates against the submitted
            `outputSchema` — guaranteed by the server.
        error:
          allOf:
            - $ref: '#/components/schemas/TaskError'
          description: Failure description; present when `error`.
        promptVersion:
          type: string
          description: |-
            Version of the provider-side prompt used, e.g. `elza.revision/2026-07-02.1`.
            Record it with the task's results: it is needed to reproduce, audit, and to
            correlate result-quality feedback with prompt changes.
        usage:
          allOf:
            - $ref: '#/components/schemas/Usage'
          description: Metered usage so far (running totals; final once the state is terminal).
      description: A task and its current state — the poll response.
    TaskAccepted:
      type: object
      required:
        - taskId
        - state
      properties:
        taskId:
          type: string
          description: Id of the task (new, or pre-existing on an idempotent retry).
        state:
          allOf:
            - $ref: '#/components/schemas/TaskState'
          description: Initial state (normally `queued`).
        duplicate:
          type: boolean
          description: True if this `requestId` was already seen for the subscriber (idempotent retry, no new task).
      description: The task was accepted (newly created, or recognised as an idempotent retry).
    TaskError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |-
            Machine-readable code. Defined codes (the set may grow): `MODEL_ERROR`
            (upstream model failure after retries), `SCHEMA_ERROR` (model could not
            produce schema-valid output), `TOOL_TIMEOUT` (client did not return tool
            results in time), `INPUT_TOO_LARGE`, `UNSUPPORTED_TASK_TYPE`, `INTERNAL`.
        message:
          type: string
          description: Human-readable message.
      description: Failure description of a task in state `error`.
    TaskMetadata:
      type: object
      properties:
        instanceName:
          type: string
          description: Identifier of the client instance the task originates from, e.g. `PROD`.
        app:
          type: string
          description: Originating application, e.g. `elza`.
        appVersion:
          type: string
          description: Application version, e.g. `3.5.0`.
        requestedBy:
          type: string
          description: |-
            User on whose behalf the task runs (e.g. the Elza username), for audit and
            attribution when the signing key is installation-wide. With a user-scoped
            key this should match the key's user.
        fundUuid:
          type: string
          description: Identifier of the archival fund concerned, if any (UUID).
      additionalProperties: {}
      description: |-
        Client-supplied context of a task. Not interpreted by the AI; used for audit,
        support and the provider's reporting. Open for additive growth.
    TaskProgress:
      type: object
      properties:
        message:
          type: string
          description: Short human-readable status, suitable for direct display.
        percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Rough completion estimate, 0–100.
      description: |-
        Progress signal for the user while the task runs. Best-effort and advisory —
        a client must not depend on any particular granularity.
    TaskState:
      type: string
      enum:
        - queued
        - running
        - awaiting_tools
        - done
        - error
        - cancelled
      description: |-
        State of a task. Terminal states are `done`, `error`, `cancelled`. The set may
        grow additively; a client must treat an unknown state as "in progress" and
        keep polling.
    TaskType:
      type: string
      description: |-
        Task type — names the AI capability requested and selects the provider-side
        prompt; also the provider's unit of metering/pricing. An **open** set of
        string codes (a plain string on the wire, so code generators produce a
        simple type): new types are added without a contract change, and a provider
        advertises the types it supports via `GET /info`. Namespaced by client
        product (`elza.…`). Defined types:

        - `elza.echo` — integration-test task: the model restates `input` according
        to the output schema. No archival semantics — exists so both sides can
        validate the full protocol loop (auth, submit, poll, schema-enforced
        output, usage metering) cheaply before any real scenario.
        - `elza.revision` — advisory revision of archival description units: finds
        logical inconsistencies, dating mismatches, terminology problems and other
        issues that formal (rule-based) validation cannot catch. Read-only;
        findings are returned per node. The first production scenario.
    TaskTypeInfo:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: The task type code, e.g. `elza.revision`.
        name:
          type: string
          description: Human-readable name.
        description:
          type: string
          description: What the task does.
      description: A task type supported by this provider.
    ToolCall:
      type: object
      required:
        - callId
        - tool
        - arguments
      properties:
        callId:
          type: string
          description: Server-assigned id of this call; echo it back in the matching `ToolResult`.
        tool:
          type: string
          description: Name of the tool to execute (one of the task's declared tools).
        arguments:
          description: Arguments object; conforms to the tool's declared `inputSchema`.
      description: A pending call of a client-declared tool (present while `awaiting_tools`).
    ToolDefinition:
      type: object
      required:
        - name
        - description
        - inputSchema
      properties:
        name:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]*$
          description: Tool name, unique within the task, e.g. `searchNodes`.
        description:
          type: string
          description: What the tool does and when to use it — written for the model.
        inputSchema:
          type: object
          additionalProperties: {}
          description: JSON Schema of the tool's arguments object.
      description: |-
        A tool the client offers for this task — something the *client* can execute
        locally on the provider's request (a search over the client's index, a record
        lookup, …). Mirrors the tool-definition shape of AI model APIs.
    ToolResult:
      type: object
      required:
        - callId
      properties:
        callId:
          type: string
          description: '`callId` of the `ToolCall` this answers.'
        result:
          description: Tool output (any JSON).
        error:
          type: string
          description: Human-readable failure description when the tool could not be executed.
      description: The client's answer to one `ToolCall`. Exactly one of `result` / `error` is present.
    Usage:
      type: object
      required:
        - inputTokens
        - outputTokens
        - costUnits
      properties:
        inputTokens:
          type: integer
          format: int64
          description: Model input tokens consumed (informative).
        outputTokens:
          type: integer
          format: int64
          description: Model output tokens produced (informative).
        costUnits:
          type: number
          format: double
          description: Billable cost units per the provider's price list.
      description: |-
        Metered usage of a task so far — running totals, present from the first model
        call onward (also on failed tasks: incurred usage counts). `costUnits` is the
        billable quantity: a model-independent unit defined by the provider's price
        list, so model changes on the provider side never change the unit the
        subscriber sees.
  securitySchemes:
    SignatureAuth:
      type: apiKey
      in: header
      name: Authorization
      description: ELZA-AI-HMAC-SHA256 request signature carried in the `Authorization` header (the secret is never sent). See the API description and security.md for the canonical string and KeyId scoping.
servers:
  - url: '{endpoint}'
    description: Provider-assigned base endpoint, e.g. https://ai.example.com/elza
    variables:
      endpoint:
        default: ''
        description: Base URL the provider assigned to the subscriber; may embed the provider's own account routing.
