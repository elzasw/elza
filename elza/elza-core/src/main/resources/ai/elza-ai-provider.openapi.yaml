  /tasks/{taskId}:
    get:
      operationId: getTask
      description: |-
        Read a task's current state (long poll). With `wait`, the server holds the
        request up to that many seconds and responds as soon as the state changes —
        the recommended way to drive the loop without tight polling.
      parameters:
        - $ref: '#/components/parameters/SignedRequest'
        - name: taskId
          in: path
          required: true
          description: Task id from `TaskAccepted`.
          schema:
            type: string
        - name: wait
          in: query
          required: false
          description: Long-poll timeout in seconds; `0`/absent = answer immediately. Capped by `Limits.maxWaitSeconds`.
          schema:
            type: integer
            format: int32
            minimum: 0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
