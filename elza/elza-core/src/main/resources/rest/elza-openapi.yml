      type: object
      required:
        - id
        - severity
      properties:
        id:
          type: integer
          description: binding_issue_id
        uuid:
          type: string
          description: stable identifier from CAM, when provided
        severity:
          $ref: '#/components/schemas/ExtIssueSeverity'
        status:
          $ref: '#/components/schemas/ExtIssueStatus'
        ruleCode:
          type: string
        issueCode:
          type: string
        message:
          type: string
        source:
          type: string
        detail:
          type: string
        note:
          type: string
        issueFrom:
          type: string
          format: date-time
          description: valid-from timestamp from CAM
        extFromRev:
          type: string
          description: external revision in which the issue first appeared
        partId:
          type: integer
          description: referenced part of the AP, when applicable
        itemId:
          type: integer
          description: referenced item of the AP, when applicable
        relatedBindingId:
          type: integer
          description: related binding within the same external system, when applicable
        relatedBindingExtValue:
          type: string
          description: value of the related binding in the external system
      description: |-
        One issue/finding reported by CAM about an entity binding. Issues are not
        versioned in Elza — only the current state synced from CAM is kept. Issue
        references never cross external systems: relatedBindingId always points to
        a binding within the same external system as this entity.
    ExtIssueIconState:
      type: string
      enum:
        - NONE
        - NEUTRAL
        - NEW
        - ATTENTION
      description: |-
        Aggregated badge state computed by the server from all issues on a binding.

        NONE      no issues
        NEUTRAL   only WARNING issues with status IR_ALL_REVISIONS_OK / IR_REVISION_OK
        NEW       at least one WARNING with status absent
        ATTENTION any ERROR, or any status = IR_FIX_NEEDED — single most prominent icon
    ExtIssueSeverity:
      type: string
      enum:
        - WARNING
        - ERROR
