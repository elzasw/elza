      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataFormattedText:
      type: object
      required:
        #- dataType
        - value
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - FORMATTED_TEXT
        value:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataInteger:
      type: object
      required:
        #- dataType
        - integerValue
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - INT
        integerValue:
          type: integer
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataJsonTable:
      type: object
      required:
        #- dataType
        - value
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - JSON_TABLE
        value:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataRecordRef:
      type: object
      required:
        #- dataType
        - value
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - RECORD_REF
        value:
          type: integer
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataString:
      type: object
      required:
        #- dataType
        - stringValue
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - STRING
        stringValue:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataStructureRef:
      type: object
      required:
        #- dataType
        - structuredObjectId
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - STRUCTURED
        structuredObjectId:
          type: integer
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataText:
      type: object
      required:
        #- dataType
        - textValue
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - TEXT
        textValue:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataType:
      type: string
      enum:
        - INT
        - STRING
        - TEXT
        - UNITDATE
        - UNITID
        - FORMATTED_TEXT
        - COORDINATES
        - RECORD_REF
        - DECIMAL
        - STRUCTURED
        - ENUM
        - FILE_REF
        - JSON_TABLE
        - DATE
        - URI_REF
        - BIT
      description: Data types for ItemData classes
    DataUnitdate:
      type: object
      required:
        #- dataType
        - value
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - UNITDATE
        value:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataUnitid:
      type: object
      required:
        #- dataType
        - unitId
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - UNITID
        unitId:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataUriRef:
      type: object
      required:
        #- dataType
        - value
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - URI_REF
        nodeId:
          type: integer
        value:
          type: string
        description:
          type: string
        refTemplateId:
          type: integer
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DeleteAccessPointDetail:
      type: object
      properties:
        replacedBy:
          type: string
