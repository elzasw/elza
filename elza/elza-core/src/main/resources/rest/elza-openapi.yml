            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestProcessState'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - report
  /report/{requestId}:
    get:
      operationId: Report_getReport
      description: Download statistics results by request id
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
        - name: format
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Report.ReportFormat'
          explode: false
      responses:
        '102':
          description: Informational
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report.ReportData'
            text/csv:
              schema:
                type: string
                format: binary
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - report
  /rules/itemTypes:
    get:
      operationId: Rules_listItemTypes
      description: |-
        Returns item types together with their specifications and rendering hints.
        By default all item types across loaded rule sets; when `ruleSetCode` is
        given, only the item types available in that rule set.

        Public URL: `GET /api/v1/rules/itemTypes`.

        Localized strings (`name`, `shortcut`, `description` on `ItemType` and
        `ItemTypeSpec`, plus `name` on `ItemTableColumn`) honour the
        `Accept-Language` request header when provided; otherwise the server
        default language is used.

        Replaces the legacy `GET /api/rule/descItemTypes`.
      parameters:
        - name: ruleSetCode
          in: query
          required: false
          description: When set, return only the item types available in this rule set (`RulRuleSet.code`); otherwise all loaded rule sets.
          schema:
            type: string
          explode: false
        - name: Accept-Language
          in: header
          required: false
          description: Preferred language for localized strings (e.g. "cs", "en").
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemTypeList'
      tags:
        - rules
  /rules/partTypes:
    get:
      operationId: Rules_listPartTypes
      description: |-
        Returns all types of parts.

        Public URL: `GET /api/v1/rules/partTypes`.

        Replaces the legacy `GET /api/structure/part-type`.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PartType'
      tags:
        - rules
