  /aiprovider/conversation:
    post:
      operationId: AiProvider_createConversation
      description: |-
        Starts a new AI conversation: creates the thread, stores and submits its
        first exchange to the configured provider. State changes are then
        announced over the WebSocket (event AI_REQUEST carrying conversation and
        request ids + new state); the client refetches the conversation detail.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConversationDetail'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aiprovider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiConversationCreate'
    get:
      operationId: AiProvider_listConversations
      description: |-
        Lists the current user's conversations, newest activity first;
        optionally filtered by context.
      parameters:
        - name: contextType
          in: query
          required: false
          description: context type code filter
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiConversation'
      tags:
        - aiprovider
  /aiprovider/conversation/{id}:
    get:
      operationId: AiProvider_getConversation
      description: |-
        Full refresh of one conversation: the thread with all its exchanges,
        states and render-ready blocks.
      parameters:
        - name: id
          in: path
          required: true
          description: conversation id
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiConversationDetail'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aiprovider
  /aiprovider/conversation/{id}/request:
    post:
      operationId: AiProvider_createRequest
      description: |-
        Submits a follow-up exchange into an existing conversation (continues
        the provider-side conversation context).
