components:
  parameters:
    AipIdParameter:
      name: aipId
      in: path
      required: true
      description: Aip ID
      schema:
        type: integer
    FsRepoIdParameter:
      name: fsrepoId
      in: path
      required: true
      description: FileSystem repository ID
      schema:
        type: integer
    FundIdParameter:
      name: fundId
      in: path
      required: true
      description: Fund ID
      schema:
        type: integer
    FundVersionIdParameter:
      name: fundVersionId
      in: path
      required: true
      description: Fund ID Version
      schema:
        type: integer
    NodeIdParameter:
      name: nodeId
      in: path
      required: true
      description: Node ID
      schema:
        type: integer
    PublicationIdParameter:
      name: publicationId
      in: path
      required: true
      description: Publication ID (ARR_EXPORT.export_id).
      schema:
        type: integer
  schemas:
    AbstractField:
      type: object
      required:
        - fieldType
      properties:
        fieldType:
          $ref: '#/components/schemas/FieldType'
      discriminator:
        propertyName: fieldType
        mapping:
          FONDS_FIELD: '#/components/schemas/FondsField'
          NODE_FIELD: '#/components/schemas/NodeField'
          DESC_ITEM: '#/components/schemas/DescItemField'
          AIP_FIELD: '#/components/schemas/AipField'
      description: Used as a parent for filter fields
    AbstractFilter:
      type: object
      required:
        - filterType
      properties:
        filterType:
          $ref: '#/components/schemas/FilterType'
      discriminator:
        propertyName: filterType
        mapping:
          fieldValue: '#/components/schemas/FieldValueFilter'
          contains: '#/components/schemas/MultimatchContainsFilter'
          logical: '#/components/schemas/LogicalFilter'
          textValue: '#/components/schemas/TextValueFilter'
          numberValue: '#/components/schemas/NumberValueFilter'
          boolValue: '#/components/schemas/BoolValueFilter'
          dateValue: '#/components/schemas/DateValueFilter'
          enumValue: '#/components/schemas/EnumValueFilter'
          refValue: '#/components/schemas/RefValueFilter'
      description: Used as a parent for all other filters
    AccessPointBatchExportParams:
      type: object
      properties:
        search:
          type: string
          description: Full-text search
        apTypeId:
          type: integer
          description: Single AP-type id; subtree-expanded on the backend to include descendant types
        versionId:
          type: integer
          description: Fund version id (used to resolve scope context, optional)
        scopeId:
          type: integer
          description: Scope id; expanded on the backend for the resolved fund + user-visible scopes
        itemTypeId:
          type: integer
          description: Restrict to AP types referenced from this item type
        itemSpecId:
          type: integer
          description: Restrict to AP types referenced from this item specification
        state:
          allOf:
            - $ref: '#/components/schemas/ApStateApproval'
          description: Filter by access-point state
        revState:
          allOf:
            - $ref: '#/components/schemas/RevisionState'
          description: Filter by revision state
        searchFilter:
          allOf:
            - $ref: '#/components/schemas/ApAdvanceSearchFilter'
          description: Advanced filter (mirrors the body of /accesspoint/search)
      description: |-
        Body of POST /accesspoint/export.

        Mirrors the scalar parameters of /accesspoint/search and accepts the same advanced filter
        via {
    AccessPointSearchParams:
      type: object
      properties:
        search:
          type: string
          description: Full-text search
        from:
          type: integer
          description: Offset (zero-based) of the first result to return
        count:
          type: integer
          description: Maximum number of rows to return
        apTypeId:
          type: integer
          description: Single AP-type id; subtree-expanded on the backend
        versionId:
          type: integer
          description: Fund version id (used to resolve scope context, optional)
        scopeId:
          type: integer
          description: Scope id; expanded on the backend
        itemTypeId:
          type: integer
          description: Restrict to AP types referenced from this item type
        itemSpecId:
          type: integer
          description: Restrict to AP types referenced from this item specification
        state:
          allOf:
            - $ref: '#/components/schemas/ApStateApproval'
          description: Filter by access-point state
        revState:
          allOf:
            - $ref: '#/components/schemas/RevisionState'
          description: Filter by revision state
        searchTypeName:
          allOf:
            - $ref: '#/components/schemas/ApSearchType'
          description: Search strategy applied to access-point name (criteria-query path)
        searchTypeUsername:
          allOf:
            - $ref: '#/components/schemas/ApSearchType'
          description: Search strategy applied to user / username (criteria-query path)
        searchFilter:
          allOf:
            - $ref: '#/components/schemas/ApAdvanceSearchFilter'
          description: Advanced filter; same precedence rule as AccessPointBatchExportParams
      description: Body of POST /accesspoint/search.
    Admin.CopyPermissionParams:
      type: object
      required:
        - fromUserId
      properties:
        fromUserId:
          type: integer
    AdminInfo:
      type: object
      required:
        - funds
        - levels
        - accessPoints
        - users
        - loggedUsers
      properties:
        funds:
          type: integer
          format: int32
          description: Number of funds
        levels:
          type: integer
          format: int32
          description: Number of valid levels
        accessPoints:
          type: integer
          format: int32
          description: Number of valid access points
        users:
          type: integer
          format: int32
          description: Number of users
        loggedUsers:
          type: integer
          format: int32
          description: Number of logged users
      description: Basic statistics about Elza instance
    AipField:
      type: object
      required:
        - fieldName
      properties:
        fieldName:
          allOf:
            - $ref: '#/components/schemas/AipFieldName'
          description: Name of field (from enum AipFieldName)
      allOf:
        - $ref: '#/components/schemas/AbstractField'
      description: AIP specific search field
    AipFieldName:
      type: string
      enum:
        - aipId
        - code
        - aipVersion
        - fund
        - fundCode
        - institution
        - institutionCode
        - unitdate
        - originator
        - ingestionCode
        - referenceNumber
        - nadChangeCode
        - aipSize
        - metadataLoad
        - completeAipLoad
        - problemType
        - importState
        - exportState
      description: |-
        AIP specific field names.

        `unitdate` covers the whole dating of the AIP, that is both its start and its end.
    AiProviderInfo:
      type: object
      required:
        - protocolVersion
        - taskTypes
        - profiles
      properties:
        protocolVersion:
          type: string
          description: Protocol version reported by the provider (`major.minor`).
        providerName:
          type: string
          description: Human-readable provider/service name.
        taskTypes:
          type: array
          items:
            $ref: '#/components/schemas/AiTaskType'
          description: Task types the provider currently offers.
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/AiProfile'
          description: Quality/cost tiers the provider offers.
      description: |-
        The AI provider's capabilities — the client's typed view of the provider's
        `/info` catalog. Drives the panel: which tasks to offer and, per task, which
        typed parameters to gather. Grows additively (new task types, new object
        types); a client tolerates unknown parameter/result `type` codes.
    AiTaskType:
      type: object
      required:
        - code
        - parameters
        - resultTypes
      properties:
        code:
          type: string
          description: Task type code, e.g. `elza.chat`, `elza.echo`, `elza.revision`.
        name:
          type: string
        description:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/AiTaskParameter'
          description: Typed parameters the task declares; the client fills these from context.
        resultTypes:
          type: array
          items:
            type: string
          description: Object type codes the task's result may contain (client rendering readiness).
      description: One AI task the provider offers, with the typed parameters it declares.
    AiTaskParameter:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          description: Parameter name — the key under which the client supplies its value.
        type:
          type: string
          description: Object type code of the value, e.g. `elza.text`, `elza.archivalDescription`.
        description:
          type: string
        required:
          type: boolean
          description: Whether the caller must supply it.
      description: One typed parameter a task declares.
    AiProfile:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        default:
          type: boolean
          description: True for the tier used when a submission names none.
      description: A quality/cost tier the provider offers.
    AiContextType:
      type: string
      enum:
        - FUND
        - NODE
        - ACCESSPOINT
      description: |-
        Type of a UI context object — the discriminator of `AiContextObject`. Names
        what part of the application the user is working in when an AI request is sent.
    AiContextObject:
      type: object
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/AiContextType'
          description: Selects the context shape; one of the defined `AiContextType` codes.
      discriminator:
        propertyName: type
        mapping:
          FUND: '#/components/schemas/AiContextFund'
          NODE: '#/components/schemas/AiContextNode'
          ACCESSPOINT: '#/components/schemas/AiContextAccesspoint'
      description: |-
        A typed piece of the UI's current context, sent with an AI request. Elza
        resolves each into the provider's typed objects (e.g. a fund into an
        `elza.fundInfo` object read from the DB) before submitting the task.
    AiContextFund:
      type: object
      required:
        - fundId
      properties:
        fundId:
          type: integer
          format: int32
          description: '`ArrFund.fundId`.'
      allOf:
        - $ref: '#/components/schemas/AiContextObject'
      description: The archival fund the user is working in.
    AiContextNode:
      type: object
      required:
        - nodeId
      properties:
        fundId:
          type: integer
          format: int32
          description: |-
            `ArrFund.fundId`. Present for a UI-context node or a search hit; absent
            on a link built from a bare object reference (a tool event's `refs`),
            where only the node id is known and the fund is not needed to navigate.
        fundVersionId:
          type: integer
          format: int32
        nodeId:
          type: integer
          format: int32
      allOf:
        - $ref: '#/components/schemas/AiContextObject'
      description: A description unit (node) within a fund.
    AiContextAccesspoint:
      type: object
      required:
        - accessPointId
      properties:
        accessPointId:
          type: integer
          format: int32
      allOf:
        - $ref: '#/components/schemas/AiContextObject'
      description: An access point / entity from the registry.
    AiConversation:
      type: object
      required:
        - id
        - externalSystemCode
        - title
        - createDate
        - lastChangeDate
      properties:
        id:
          type: integer
        externalSystemCode:
          type: string
          description: Code of the AI external system the conversation runs against.
        title:
          type: string
        contextType:
          type: string
          description: "`AiContextType` of the conversation's primary context object, for list filtering."
        context:
          type: array
          items:
            $ref: '#/components/schemas/AiContextObject'
          description: The conversation's current context objects.
        createDate:
          type: string
          format: date-time
        lastChangeDate:
          type: string
          format: date-time
      description: One AI conversation (topic/thread) as shown in the panel history.
    AiConversationCreate:
      type: object
      required:
        - externalSystemCode
        - taskType
      properties:
        externalSystemCode:
          type: string
          description: Code of the AI external system to use.
        taskType:
          type: string
          description: Task type, e.g. `elza.echo`, `elza.revision`.
        profile:
          type: string
          description: Profile/model to use (an `AiProfile.code` from GET /info); omitted = provider default.
        title:
          type: string
          description: Thread title; when omitted the server derives it from the instructions.
        userInstructions:
          type: string
          description: The user's message.
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/AiContextObject'
          description: Task parameters as typed context objects; Elza resolves each and matches it to the task's declared parameter by object type.
        context:
          type: array
          items:
            $ref: '#/components/schemas/AiContextObject'
          description: Supplementary context objects; Elza resolves them into the provider's `context`.
      description: 'Starts a conversation: creates the thread and submits its first exchange.'
    AiConversationDetail:
      type: object
      required:
        - conversation
        - requests
      properties:
        conversation:
          $ref: '#/components/schemas/AiConversation'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AiRequest'
      description: 'Full conversation detail: the thread = requests in create order.'
    AiCitation:
      type: object
      required:
        - fragment
      properties:
        fragment:
          type: string
          description: |-
            Stable citation id of the cited section — the client's list key and the
            fallback label shown when no `title` is known.
        url:
          type: string
          description: Deep link to the cited section in the published source, when resolvable.
        title:
          type: string
          description: Human-readable title of the cited section (the primary label).
        source:
          type: string
          description: Human-readable name of the source document the section belongs to.
        sourceId:
          type: string
          description: Id of the source document — lets the client group citations by source.
      description: |-
        One cited source in a `DOC_CITATIONS` display block. Carries only data — the
        client owns all human-readable chrome (the "Sources" heading, the localized
        label when a field is absent).
    AiDisplayBlockType:
      type: string
      enum:
        - TEXT
        - MARKDOWN
        - TABLE
        - DOC_CITATIONS
        - NODE_UPDATE_PROPOSALS
      description: |-
        Display block type — the discriminator of `AiDisplayBlock`. The client renders
        each block by this code, reading the fields of the matching subtype. Additive:
        new types may appear; a client MUST tolerate an unknown type by rendering a
        generic "unsupported content" placeholder (never dropping the block silently).
    AiDisplayBlock:
      type: object
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/AiDisplayBlockType'
          description: Selects the block shape; one of the defined `AiDisplayBlockType` codes.
        followUps:
          type: array
          items:
            $ref: '#/components/schemas/AiFollowUpAction'
          description: |-
            Server-suggested continuations of the conversation, rendered as buttons
            under the block. Clicking one submits a follow-up (`AiRequestCreate`)
            with the action's `taskType`/`userInstructions` into the same
            conversation — e.g. a check finding's "prepare the fix" action submits
            an `elza.enhanceDescription` exchange into the `elza.revision` thread.
      discriminator:
        propertyName: type
        mapping:
          TEXT: '#/components/schemas/AiTextBlock'
          MARKDOWN: '#/components/schemas/AiMarkdownBlock'
          TABLE: '#/components/schemas/AiTableBlock'
          DOC_CITATIONS: '#/components/schemas/AiDocCitationsBlock'
          NODE_UPDATE_PROPOSALS: '#/components/schemas/AiNodeUpdateProposalsBlock'
      description: |-
        One display block of an AI response — THE RENDERING CONTRACT between the
        server and the client. The server (per task type) transforms the provider's
        schema-validated output into an ordered list of blocks; the client renders
        each block by its `type` (see `AiDisplayBlockType`), reading the fields of the
        matching subtype below.

        Evolution is additive: new block types may appear. A client MUST tolerate an
        unknown `type` by rendering a generic "unsupported content" placeholder (never
        dropping the block silently). Server-side fallback rule: a task output whose
        object type has no block mapper is rendered as one `MARKDOWN` block containing
        the output JSON in a fenced code block.
    AiFollowUpAction:
      type: object
      required:
        - label
        - userInstructions
      properties:
        label:
          type: string
          description: Button label, in the deployment's language.
        taskType:
          type: string
          description: Task type of the follow-up exchange; omitted = the conversation's current type.
        userInstructions:
          type: string
          description: The seeded user instruction the follow-up submits.
      description: |-
        One server-suggested follow-up: the button label and the exchange it
        submits. The same shape a future provider-emitted `elza.taskSuggestion`
        result block maps onto — today the server composes these itself (per check
        finding).
    AiTextBlock:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: The text, rendered as-is.
      allOf:
        - $ref: '#/components/schemas/AiDisplayBlock'
      description: Plain-text answer — `content` is rendered verbatim, never parsed as markdown.
    AiMarkdownBlock:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          description: CommonMark + GFM source; the client renders through a sanitizing renderer.
      allOf:
        - $ref: '#/components/schemas/AiDisplayBlock'
      description: Free-text answer as CommonMark + GFM tables; the server MUST NOT emit raw HTML.
    AiTableBlock:
      type: object
      required:
        - columns
        - rows
      properties:
        caption:
          type: string
          description: Optional caption above the table.
        columns:
          type: array
          items:
            $ref: '#/components/schemas/AiTableColumn'
          description: Ordered column definitions (order, key and label).
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
          description: Rows as objects keyed by column `key`; cell values are plain text (no markup).
      allOf:
        - $ref: '#/components/schemas/AiDisplayBlock'
      description: |-
        Structured tabular data — the client renders a native table widget. Use
        whenever the data IS tabular, never serialized into markdown.
    AiDocCitationsBlock:
      type: object
      required:
        - citations
      properties:
        citations:
          type: array
          items:
            $ref: '#/components/schemas/AiCitation'
          description: The cited sources, in first-referenced order.
      allOf:
        - $ref: '#/components/schemas/AiDisplayBlock'
      description: |-
        The knowledge/documentation sources the answer relied on. The server emits no
        label text; the client renders a "Sources" list and supplies the heading
        itself, in the user's language.
    AiNodeUpdateProposalsBlock:
      type: object
      required:
        - nodes
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/AiProposalNode'
          description: Proposals grouped per level, in the result's order.
      allOf:
        - $ref: '#/components/schemas/AiDisplayBlock'
      description: |-
        Proposed changes to the description items of arrangement levels — the
        render-ready view of an `elza.nodeUpdateProposals` task result
        (elza-development/typespec-ai/tasks/elza-enhance-description.md). The client
        renders one card per change with old→new diff rows; the user applies or
        rejects each change (the consent unit — its operations are applied
        together), or refines the request with a follow-up. All names and values
        are resolved server-side against the level's current state; nothing is ever
        applied without the explicit apply call.
    AiProposalNode:
      type: object
      required:
        - node
        - changes
      properties:
        node:
          allOf:
            - $ref: '#/components/schemas/AiActivityLink'
          description: The level as a navigable link (label = tree title).
        changes:
          type: array
          items:
            $ref: '#/components/schemas/AiProposalChange'
          description: The level's proposed changes, in display order.
      description: The proposed changes of one arrangement level.
    AiProposalChange:
      type: object
      required:
        - changeKey
        - reason
        - state
        - operations
      properties:
        changeKey:
          type: string
          description: Stable key of the change within the request — the apply/reject address.
        reason:
          type: string
          description: Why the change is proposed — user-facing, self-contained.
        confidence:
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: The model's certainty, 0–100, when reported.
        state:
          type: string
          description: PROPOSED | APPLIED | REJECTED | BLOCKED | SUPERSEDED (open set).
        blockedReason:
          type: string
          description: User-facing reason when state = BLOCKED.
        decideDate:
          type: string
          format: date-time
          description: When the APPLIED/REJECTED decision was made.
        operations:
          type: array
          items:
            $ref: '#/components/schemas/AiProposalOperation'
          description: The change's operations, applied together.
      description: |-
        One proposed change — the unit the user accepts or rejects; its operations
        are applied together, in one versioned change. `state` is an open set:
        `PROPOSED` (awaiting decision), `APPLIED`, `REJECTED`, `BLOCKED` (fails
        validation against the level's current state — see `blockedReason`),
        `SUPERSEDED` (a newer exchange re-proposed for the same level); a client
        renders an unknown state as a read-only card.
    AiProposalOperation:
      type: object
      required:
        - kind
        - itemTypeName
      properties:
        kind:
          type: string
          description: ADD | UPDATE | DELETE (open set).
        itemTypeName:
          type: string
          description: Display name of the item type, e.g. `Šířka`.
        specName:
          type: string
          description: Display name of the specification, for enumerated types.
        oldValue:
          type: string
          description: The item's current value (UPDATE/DELETE).
        newValue:
          type: string
          description: The proposed value (ADD/UPDATE).
        entity:
          allOf:
            - $ref: '#/components/schemas/AiActivityLink'
          description: Referenced entity as a navigable link, for access-point values.
      description: |-
        One rendered item operation of a proposed change — a diff row. `kind` = `ADD`
        (`newValue` only), `UPDATE` (`oldValue` → `newValue`) or `DELETE`
        (`oldValue` only); open set, a client renders an unknown kind as plain text.
    AiProposalDecisionRequest:
      type: object
      required:
        - changeKey
      properties:
        changeKey:
          type: string
          description: '`AiProposalChange.changeKey` of the change to decide.'
      description: Addresses one proposed change of an exchange's proposals block.
    AiActivityLink:
      type: object
      required:
        - target
      properties:
        label:
          type: string
          description: Display label — node title, reference designation or fund name.
        target:
          allOf:
            - $ref: '#/components/schemas/AiContextObject'
          description: Navigation target — reuses the UI-context vocabulary (`AiContextType` codes).
      description: One object an activity touched, renderable as a navigation link.
    AiRequest:
      type: object
      required:
        - id
        - taskType
        - state
        - createDate
      properties:
        id:
          type: integer
        taskType:
          type: string
        state:
          type: string
        userInstructions:
          type: string
          description: The user's message of this exchange.
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/AiDisplayBlock'
          description: Render-ready response (present when state = done).
        errorCode:
          type: string
        errorMessage:
          type: string
        progressMessage:
          type: string
          description: Short human-readable phase while the request runs (advisory, best-effort; absent once terminal).
        progressPercent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Rough completion estimate 0–100 (advisory).
        partialAnswer:
          type: string
          description: |-
            Accumulated streamed answer text of a running request (provider protocol
            0.8+, `answer_delta` events). Provisional: it may still be superseded by
            the provider — the authoritative answer arrives in `blocks` when state =
            done. Absent once terminal, when the provider streams nothing, or after a
            server restart mid-exchange.
        activities:
          type: array
          items:
            $ref: '#/components/schemas/AiRequestActivity'
          description: User-visible steps of the exchange (tool executions, preparation steps), oldest first.
        promptVersion:
          type: string
        profile:
          type: string
          description: Profile/model used for this exchange (an `AiProfile.code`); absent = provider default.
        usage:
          $ref: '#/components/schemas/AiUsage'
        createDate:
          type: string
          format: date-time
        finishDate:
          type: string
          format: date-time
      description: |-
        One exchange with the AI provider within a conversation. `state` is an open
        set (`queued`, `running`, `awaiting_tools`, `done`, `error`, `cancelled`);
        a client MUST treat an unknown state as "in progress". `blocks` is present
        when `done` (see AiDisplayBlock for the rendering contract).

        Live updates: while an exchange runs, the server pushes this object to the
        conversation owner's per-user WebSocket topic `/topic/user/{userId}` as
        `{eventType: "AI_REQUEST_UPDATE", conversationId, request}`. Each message is
        a complete snapshot — the client replaces the request by `id` (delivery is
        best effort; the client refetches the conversation on reconnect).
    AiRequestActivity:
      type: object
      required:
        - id
        - kind
        - state
        - startDate
      properties:
        id:
          type: string
          description: Stable id of the step within the exchange (the provider's tool-call id).
        kind:
          type: string
          description: TOOL_CALL | PREPARATION (open set).
        tool:
          type: string
          description: |-
            Tool name for TOOL_CALL: a client tool Elza executed (`searchNodes`,
            `getItemTypes`, …) or a provider-internal one (`search_knowledge`, …);
            an unknown name renders as a generic step.
        label:
          type: string
          description: |-
            Localized, display-ready name of a provider-internal step (from the
            task-event stream); render in place of `tool`. Absent for a client tool
            Elza executed itself — the client renders those from `tool`.
        state:
          type: string
          description: RUNNING | DONE | ERROR (open set).
        query:
          type: string
          description: 'Data-like input summary: the fulltext query / the rule-set code.'
        summary:
          type: string
          description: |-
            Localized, display-ready one-line detail of a provider-internal step: the
            call's key arguments, or a short result summary once DONE. Secondary text
            next to `label`; for a client tool the client shows `query`/`resultCount`
            instead.
        resultCount:
          type: integer
          format: int64
          description: 'Result size once DONE: search hits, dictionary entries.'
        partial:
          type: boolean
          description: True when `links` holds only the first hits of a larger result.
        links:
          type: array
          items:
            $ref: '#/components/schemas/AiActivityLink'
          description: Objects the step touched, as navigable links (search hits).
        error:
          type: string
          description: Failure description when state = ERROR.
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
      description: |-
        One user-visible step of an exchange — a client-tool execution the model
        requested while working on the answer. `kind`, `tool` and `state` are open
        sets: the client renders an unknown kind/tool as a generic step and treats
        an unknown state as still running. Steps stay with the conversation
        permanently; a linked object may since have been deleted — the client
        handles a failed navigation gracefully.
    AiRequestCreate:
      type: object
      properties:
        taskType:
          type: string
          description: |-
            Task type of this exchange; omitted = reuse the conversation's previous type.
            A differing type still continues the conversation (the provider chains it via
            `parentTaskId`) — the "fix this finding" handoff submits `elza.enhanceDescription`
            into a `elza.revision` thread this way.
        profile:
          type: string
          description: Profile/model for this exchange (an `AiProfile.code`); omitted = reuse the conversation's last.
        userInstructions:
          type: string
        parameters:
