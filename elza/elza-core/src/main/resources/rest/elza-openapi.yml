        - id
        - uuid
        - name
        - institutionIdentifier
      properties:
        id:
          type: integer
          description: Identifikátor
        uuid:
          type: string
          description: UUID - identifikátor AS
        name:
          type: string
          description: Název
        institutionIdentifier:
          type: string
          description: Identifikátor instituce (vždy kód instituce)
        internalCode:
          type: string
          description: Interní kód
        createDate:
          type: string
          format: date-time
          description: Datum založení
        fundNumber:
          type: integer
          description: Číslo archivního souboru
        unitdate:
          type: string
          description: Datace
        mark:
          type: string
          description: Značka archivního souboru
      description: Archivní soubor
    FundDetail:
      type: object
      required:
        - id
        - uuid
        - name
        - institutionIdentifier
        - scopes
      properties:
        id:
          type: integer
          description: Identifikátor
        uuid:
          type: string
          description: UUID - identifikátor AS
        name:
          type: string
          description: Název
        institutionIdentifier:
          type: string
          description: Identifikátor instituce (vždy kód instituce)
        internalCode:
          type: string
          description: Interní kód
        createDate:
          type: string
          format: date-time
          description: Datum založení
        fundNumber:
          type: integer
          description: Číslo archivního souboru
        unitdate:
          type: string
          description: Datace
