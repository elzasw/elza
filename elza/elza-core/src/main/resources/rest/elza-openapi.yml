openapi: 3.0.2
info:
  title: ELZA API
  version: 1.0.0
tags:
  - name: institution
    description: Správa institucí
  - name: output
    description: Výstupy archivních souborů
  - name: rules
    description: Pravidla popisu archiválií (typy atributů, datové typy, …)
  - name: accesspoint-internal
    description: Access-point API used by the Elza UI
  - name: publication-internal
    description: Publication API used by the Elza UI
  - name: publication
    description: Public API for the publication system
  - name: tasks
    description: Úkoly
  - name: search
    description: Vyhledávání
  - name: structure
    description: structure
  - name: node
    description: Práce s úrovněmi a uzly
  - name: report
    description: Statistické zprávy
  - name: aips
    description: aips
  - name: io
    description: Vstup a výstup informací
  - name: accesspoints
    description: Přístupové body a archivní entity
  - name: descitems
    description: Záznamy v archivních fondech
  - name: funds
    description: Archivní soubory
  - name: aiprovider
    description: Externí AI systémy (poskytovatelé AI služeb)
  - name: externalsystems
    description: Externí systémy
  - name: daos
    description: Digitální archivní objekty
  - name: admin
    description: Administrativní funkce
servers:
  - url: http://localhost
    description: Výchozí server
  - url: http://localhost:8080
    description: Devel server
paths:
  /accesspoint:
    delete:
      operationId: AccessPoint_deleteAccessPoints
      description: Invalidation of access points
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccessPointsDetail'
        description: seznam ID nebo UUID, které chceme smazat
  /accesspoint/export:
    post:
      operationId: AccessPoint_batchExport
      description: |-
        Asynchronously export access points matching the given filter to CSV.

        Returns the request id; poll /io/export-status/{id} and download the result via /io/file/{id}.
        Results are ordered by accessPointId ascending. Empty body / null fields means
        "all access points visible to the user".
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '401':
          description: Access is unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
        '403':
          description: Access is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPointBatchExportParams'
        description: filter selecting the access points to export
  /accesspoint/export/{queueItemId}:
    put:
      operationId: AccessPoint_exportForceOrNo
      description: Decision on forced export ELZA -> CAM
      parameters:
        - name: queueItemId
          in: path
          required: true
          description: id of queue
          schema:
            type: integer
        - name: force
          in: query
          required: true
          description: 'force export: yes or no'
          schema:
            type: boolean
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/invalidated:
    get:
      operationId: AccessPoint_getInvalidatedEntities
      description: Get invalidated (deleted) entities
      parameters:
        - name: page
          in: query
          required: false
          description: number of the page
          schema:
            type: integer
            default: 0
          explode: false
        - name: pageSize
          in: query
          required: false
          description: page size
          schema:
            type: integer
            default: 10
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidatedEntities'
      tags:
        - accesspoints
  /accesspoint/search:
    post:
      operationId: AccessPoint_search
      description: |-
        Search for access points.
        Accepts the same filter inputs as /accesspoint/export (scalar fields + ApAdvanceSearchFilter)
        plus pagination (from, count) and the criteria-query SearchType selectors.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApAccessPointSearchResult'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessPointSearchParams'
        description: filter selecting the access points to search for
  /accesspoint/{id}:
    delete:
      operationId: AccessPoint_deleteAccessPoint
      description: Invalidation of access point (delete/replace)
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccessPointDetail'
        description: addition for method of invalidation
  /accesspoint/{id}/autoitems:
    get:
      operationId: AccessPoint_getAutoitems
      description: List of automatically generated elements of the description
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAutoItems'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/copy:
    put:
      operationId: AccessPoint_copyAccessPoint
      description: Copying an archive entity
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityRef'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyAccessPointDetail'
        description: additional copy options
  /accesspoint/{id}/lastParticipants:
    get:
      operationId: AccessPoint_getLastParticipants
      description: Get a list of entity processors
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
      tags:
        - accesspoints
  /accesspoint/{id}/part:
    post:
      operationId: AccessPoint_createPart
      description: Create new part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: accesspoint version
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedPart'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApPartFormVO'
        description: data for creating a part
  /accesspoint/{id}/part/{partId}:
    post:
      operationId: AccessPoint_updatePart
      description: Update a part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: id of part
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: accesspoint version
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApPartFormVO'
        description: data for updating a part
    delete:
      operationId: AccessPoint_deletePart
      description: Delete part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of ApAccessPoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/part/{partId}/prefer-name:
    put:
      operationId: AccessPoint_setPreferName
      description: Set the preferred name of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of ApAccessPoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
      tags:
        - accesspoints
  /accesspoint/{id}/restore:
    put:
      operationId: AccessPoint_restoreAccessPoint
      description: Restore deleted entity and return to original state
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/revision:
    post:
      operationId: AccessPoint_createRevision
      description: Creating a new revision of access point
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
    delete:
      operationId: AccessPoint_deleteRevision
      description: Deleting a revision of access point
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/revision/autoitems:
    get:
      operationId: AccessPoint_getRevAutoitems
      description: List of automatically generated description elements for revision
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAutoItems'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/revision/merge:
    post:
      operationId: AccessPoint_mergeRevision
      description: Merge ApRevision & ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApStateUpdate'
        description: data for change ApState
  /accesspoint/{id}/revision/part/{partId}:
    delete:
      operationId: AccessPoint_deleteRevisionPart
      description: Delete part of revision of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of revision
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/revision/part/{partId}/prefer-name:
    put:
      operationId: AccessPoint_setPreferNameRevision
      description: Set the preferred name of revision of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of revision
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
      tags:
        - accesspoints
  /accesspoint/{id}/revision/part/{revPartId}:
    post:
      operationId: AccessPoint_updateRevisionPart
      description: Update a revision part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: revPartId
          in: path
          required: true
          description: id of revision part
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: accesspoint version
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApPartFormVO'
        description: data for updating a part
  /accesspoint/{id}/revision/state:
    put:
      operationId: AccessPoint_changeStateRevision
      description: Change state of revision of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
        - name: assignTo
          in: query
          required: false
          description: userId
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevStateChange'
        description: data for change state of revision of ApAccessPoint
  /accesspoint/{id}/state:
    put:
      operationId: AccessPoint_changeState
      description: Change state of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
        - name: assignTo
          in: query
          required: false
          description: userId
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApStateUpdate'
        description: data for change ApState
  /accesspoint/{id}/validate:
    get:
      operationId: AccessPoint_validateAccessPoint
      description: Validation of an archive entity
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: includeRevision
          in: query
          required: false
          description: include revision
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApValidationIssues'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /action/funds-change/{fundsChangeId}:
    get:
      operationId: BulkAction_getFundsChangeRuns
      description: Vrátí jednotlivé per-fond běhy patřící do jednoho vícefondového seskupení (sledování průběhu).
      parameters:
        - name: fundsChangeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FundsChangeRun'
      tags:
        - funds
  /action/funds/group:
    post:
      operationId: BulkAction_groupFundsByRuleSet
      description: |-
        Rozdělí vybrané fondy podle pravidel a vrátí dostupné hromadné akce pro každou skupinu.
        Vstupem je buď explicitní seznam fondů, nebo filtr (výběr všech odpovídajících fondů).
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundsActionGroupResult'
      tags:
        - funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundsActionGroupRequest'
  /action/queue-multi:
    post:
      operationId: BulkAction_queueMultiFundAction
      description: |-
        Spustí hromadnou akci nad více fondy najednou. Pro každý fond zvolené skupiny
        pravidel naplánuje samostatný běh; fondy jiných pravidel se nespouští.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultiFundActionResult'
      tags:
        - funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiFundActionRequest'
  /admin/arrangement/invalid-inhibited-items:
    delete:
      operationId: Admin_deleteInvalidInhibitedItems
      description: |-
        Invalidate inhibited items (arr_inhibited_item) whose source desc item
        no longer lies on an ancestor node
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
      tags:
        - admin
  /admin/arrangement/missing-cached-nodes:
    get:
      operationId: Admin_syncNodeCache
      description: Creating missing items in arr_cached_node
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
      tags:
        - admin
  /admin/info:
    get:
      operationId: Admin_info
      description: Return basic statistical info
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInfo'
      tags:
        - admin
  /admin/info/logged-users:
    get:
      operationId: Admin_loggedUsers
      description: Return list of logged users
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedUsers'
      tags:
        - admin
  /admin/user/{userId}/copy-permissions:
    post:
      operationId: Admin_copyPermissions
      description: |-
        Copy user permissions from another user

        Method will append all permissions to given user
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of target user
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Admin.CopyPermissionParams'
  /aip/bulk-connect-logic-to-jp:
    post:
      operationId: Aip_bulkConnectLogicToJp
      description: Bulk connect logical structure to JP
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipIdList
          in: query
          required: true
          description: DaAip ID list
          schema:
            type: array
            items:
              type: integer
          explode: false
        - name: daLevelViewId
          in: query
          required: true
          description: DaLevelView ID
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aips
  /aip/bulk-connect-to-jp:
    post:
      operationId: Aip_bulkConnectToJp
      description: Bulk connect to JP
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipIdList
          in: query
          required: true
          description: DaAip ID list
          schema:
            type: array
            items:
              type: integer
          explode: false
