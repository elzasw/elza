      tags:
        - aiprovider
  /aiprovider/request/{id}/proposal/apply:
    post:
      operationId: AiProvider_applyProposalChange
      description: |-
        Applies one proposed change of a finished exchange: re-validates it
        against the level's current state and writes all its item operations in
        one versioned change; the decision is recorded. Returns the refreshed
        exchange — the proposals block reflects the new state (`APPLIED`, or
        `BLOCKED` with the reason when validation newly fails).
      parameters:
        - name: id
          in: path
          required: true
          description: request id
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRequest'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aiprovider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiProposalDecisionRequest'
  /aiprovider/request/{id}/proposal/reject:
    post:
      operationId: AiProvider_rejectProposalChange
      description: |-
        Rejects one proposed change (records the decision; the description is
        not touched). Returns the refreshed exchange.
      parameters:
        - name: id
          in: path
          required: true
          description: request id
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
