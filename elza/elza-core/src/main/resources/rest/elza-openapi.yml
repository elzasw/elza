    EntityRef:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          description: id of entity
        label:
          type: string
          description: visible name of entity
        note:
          type: string
          description: optional description of entity
      description: Return value when copying ApAccessPoint
    ExportParams:
      type: object
      properties:
        apIds:
          type: array
          items:
            type: integer
        fundsSections:
          type: array
          items:
            $ref: '#/components/schemas/FundSections'
        exportFilterId:
          type: integer
        includeUUID:
          type: boolean
          default: true
        includeAccessPoints:
          type: boolean
          default: true
      description: Parameters of archive file export
    ExportRequestStatus:
      type: object
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/RequestProcessState'
        progress:
          type: integer
      description: Status of request
    ExtSystemProperty:
      type: object
      required:
        - extSystemId
        - name
        - value
      properties:
        id:
          type: integer
          description: ext system property id
        userId:
          type: integer
          description: user id
        extSystemId:
          type: integer
          description: external system id
        name:
          type: string
          description: name of property
        value:
          type: string
          description: value of property
      description: Pairs name-value for external system and user
    FindFundsResult:
      type: object
      required:
        - funds
        - totalCount
      properties:
        funds:
          type: array
          items:
            $ref: '#/components/schemas/Fund'
        totalCount:
          type: integer
      description: Výsledek vyhledávání AS
    FsItem:
      type: object
      required:
        - itemType
        - name
        - lastChange
      properties:
        itemType:
          allOf:
            - $ref: '#/components/schemas/FsItemType'
          description: 'Type of item: file or folder'
        name:
          type: string
          description: File or folder name
        size:
          type: integer
          description: File size
        lastChange:
          type: string
          format: date-time
          description: Time of last change
      description: Single file system item
    FsItemType:
      type: string
      enum:
        - FOLDER
        - FILE
      description: File system item type
    FsItems:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FsItem'
        lastKey:
          type: string
          description: Optional string to request next items. It is used if there are more items.
      description: Collection of file system items
    FsRepo:
      type: object
      required:
        - fsRepoId
        - name
        - path
      properties:
        fsRepoId:
          type: integer
          format: int32
          description: Repository ID
        code:
          type: string
          description: Optional code of repository
        name:
          type: string
          description: Repository name
        path:
          type: string
          description: Repository path
    Fund:
      type: object
