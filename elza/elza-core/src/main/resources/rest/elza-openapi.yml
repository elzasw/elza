      description: Metered usage of one exchange (informative; costUnits is the billable quantity).
    AiAccountUsage:
      type: object
      required:
        - spentCredits
        - periodStart
      properties:
        accountType:
          type: string
          description: Kind of account, e.g. `personal` or `shared` (open set).
        plan:
          type: string
          description: Plan label, e.g. `basic`; informational (a code, not for display).
        planName:
          type: string
          description: |-
            Human-readable plan name for display, e.g. `Osobní – standard` (localized).
            Absent when the provider has no display name — the client then hides the
            plan rather than showing the raw `plan` code.
        allowanceCredits:
          type: number
          format: double
          description: Credit allowance for the current period; absent = no per-account cap.
        spentCredits:
          type: number
          format: double
          description: Credits charged to this account in the current period.
        periodStart:
          type: string
          format: date-time
          description: Start of the current accounting period.
        periodEnd:
          type: string
          format: date-time
          description: End of the current accounting period — when the allowance resets.
        weeklyAllowanceCredits:
          type: number
          format: double
          description: |-
            Weekly credit allowance — an optional smoothing cap layered under the
            period allowance; absent = no weekly cap.
        weeklySpentCredits:
          type: number
          format: double
          description: Credits charged to this account in the current weekly window; absent = no weekly accounting.
        weekStart:
          type: string
          format: date-time
          description: |-
            Start of the current weekly window (the UTC calendar week clamped to the
            period start — it never spans a period boundary).
        weekEnd:
          type: string
          format: date-time
          description: End of the current weekly window — when the weekly allowance resets; never after `periodEnd`.
      description: |-
        Credit state of the account the user's signing key bills to (their personal
        seat, or the shared organizational account). Provider-computed; the client
        only displays it, typically as relative consumption
        (`spentCredits / allowanceCredits`).
    AiCustomerUsage:
