        code:
          type: string
          description: Column code.
        name:
          type: string
          description: Human-readable column name (localized).
        dataType:
          type: string
          description: Column data type — limited subset; see ELZA package XSD.
        width:
          type: integer
          description: Suggested column width.
      description: Column definition for items of `dataType == JSON_TABLE`.
    ItemType:
      type: object
      required:
        - id
        - code
        - name
        - shortcut
        - dataType
        - sortable
      properties:
        id:
          type: integer
          description: Database identifier of the underlying `rul_item_type` row. Not stable across deployments — use `code` for cross-system references.
        code:
          type: string
          description: Stable public code (e.g. "ZP2015_UNIT_ID").
        name:
          type: string
          description: Human-readable name (localized).
        shortcut:
          type: string
          description: Short label for compact UI such as column headers (localized).
        description:
          type: string
          description: Longer description (localized).
        dataType:
          allOf:
            - $ref: '#/components/schemas/DataType'
          description: Underlying value type.
        sortable:
          type: boolean
          description: Whether items of this type can be used as a sort key.
        structureTypeCode:
          type: string
          description: |-
            For `dataType == STRUCTURED` only: code of the structure type whose
            template defines this item's nested fields.
        viewDefinition:
          allOf:
            - $ref: '#/components/schemas/ItemViewDefinition'
          description: Optional rendering hints; variant determined by `dataType`.
        specs:
          type: array
          items:
            $ref: '#/components/schemas/ItemTypeSpec'
          description: Available specifications, in display order. Empty/omitted ⇒ no specifications.
