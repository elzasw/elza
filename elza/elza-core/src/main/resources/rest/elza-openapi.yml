        - report
components:
  parameters:
    FsRepoIdParameter:
      name: fsrepoId
      in: path
      required: true
      description: FileSystem repository ID
      schema:
        type: integer
    FundIdParameter:
      name: fundId
      in: path
      required: true
      description: Fund ID
      schema:
        type: integer
    FundVersionIdParameter:
      name: fundVersionId
      in: path
      required: true
      description: Fund ID Version
      schema:
        type: integer
    NodeIdParameter:
      name: nodeId
      in: path
      required: true
      description: Node ID
      schema:
        type: integer
  schemas:
    Admin.CopyPermissionParams:
      type: object
      required:
        - fromUserId
      properties:
        fromUserId:
          type: integer
    AdminInfo:
      type: object
      required:
        - funds
        - levels
        - accessPoints
        - users
        - loggedUsers
      properties:
        funds:
          type: integer
          format: int32
          description: Number of funds
        levels:
          type: integer
          format: int32
          description: Number of valid levels
        accessPoints:
          type: integer
          format: int32
          description: Number of valid access points
        users:
          type: integer
          format: int32
          description: Number of users
        loggedUsers:
          type: integer
          format: int32
          description: Number of logged users
      description: Basic statistics about Elza instance
    ApPartFormVO:
      type: object
      format: partform
      description: Data for create/update a part
    ApStateApproval:
      type: string
      enum:
        - NEW
        - TO_APPROVE
        - APPROVED
        - TO_AMEND
      description: States of ApState
    ApStateUpdate:
      type: object
      required:
        - stateApproval
      properties:
        typeId:
          type: integer
          description: id of type
        scopeId:
          type: integer
          description: id of scope
        comment:
          type: string
          description: comment
        stateApproval:
          allOf:
            - $ref: '#/components/schemas/ApStateApproval'
          description: state of ApState
      description: Data for changing state of ApAccessPoint
    ApValidationIssues:
      type: object
      required:
        - errors
        - partErrors
      properties:
        errors:
          type: array
          items:
            type: string
        partErrors:
          type: array
          items:
            $ref: '#/components/schemas/PartValidationIssues'
      description: Entity validation issues/errors
    AutoValue:
      type: object
      properties:
        itemTypeId:
          type: integer
          description: identifier of the type of the description element
        itemSpecId:
          type: integer
          description: identifier of the specification of the description element
        value:
          type: string
          description: value of the element
      description: Automatically generated elements of the description
    BaseException:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          type: string
        message:
          type: string
        level:
          type: string
        properties:
          type: object
        stackTrace:
          type: string
      description: Error specification for the client
    CopyAccessPointDetail:
      type: object
      required:
        - scope
      properties:
        scope:
          type: string
          description: code of scope or id
        replace:
          type: boolean
          description: if the original AP should be replaced
        skipItems:
          type: array
          items:
            type: integer
          description: list of description element IDs not to copy
      description: Additional copy options
    CreateFund:
      type: object
      required:
        - name
        - ruleSetCode
        - institutionIdentifier
        - scopes
      properties:
        name:
          type: string
          description: Název
        ruleSetCode:
          type: string
          description: Kód pravidel
        institutionIdentifier:
          type: string
          description: Identifikátor instituce (podpora pro kód instituce i UUID přístupového bodu)
        internalCode:
          type: string
          description: Interní kód
        uuid:
          type: string
          description: UUID - identifikátor AS (pokud není vyplněno, bude vygenerováno)
        fundNumber:
          type: integer
          description: Číslo archivního souboru
        unitdate:
          type: string
          description: Datace
        mark:
          type: string
          description: Značka archivního souboru
        adminUsers:
          type: array
          items:
            type: integer
          description: Seznam uživatelů, kteří mají administrátorská oprávnění pro zakládaný AS
        adminGroups:
          type: array
          items:
            type: integer
          description: Seznam skupin, kteří mají administrátorská oprávnění pro zakládaný AS
        scopes:
          type: array
          items:
            type: string
          minItems: 1
          description: Seznam oblastí entit
      description: Zakládaný archivní souboru
    CreatedPart:
      type: object
      required:
        - partId
        - apVersion
      properties:
        partId:
          type: integer
        apVersion:
          type: integer
      description: Result of creating a part
    DataBit:
      type: object
      required:
        #- dataType
        - bitValue
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - BIT
        bitValue:
          type: boolean
      allOf:
        - $ref: '#/components/schemas/ItemData'
      description: ItemData classes extensions
    DataCoordinates:
      type: object
      required:
        #- dataType
        - value
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - COORDINATES
        value:
          type: string
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataDate:
      type: object
      required:
        #- dataType
        - value
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - DATE
        value:
          type: string
          format: date
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataDecimal:
      type: object
      required:
        #- dataType
        - value
      properties:
        #dataType:
        #  type: string
        #  enum:
        #    - DECIMAL
        value:
          type: number
          format: decimal
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataEnum:
      type: object
      #required:
      #  - dataType
      #properties:
      #  dataType:
      #    type: string
      #    enum:
      #      - ENUM
      allOf:
        - $ref: '#/components/schemas/ItemData'
    DataFileRef:
