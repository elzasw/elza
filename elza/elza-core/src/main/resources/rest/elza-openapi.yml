openapi: 3.0.2
info:
  title: ELZA API
  version: 1.0.0
tags:
  - name: admin
    description: Administrativní funkce
  - name: daos
    description: Digitální archivní objekty
  - name: externalsystems
    description: Externí systémy
  - name: funds
    description: Archivní soubory
  - name: descitems
    description: Záznamy v archivních fondech
  - name: accesspoints
    description: Přístupové body a archivní entity
  - name: search
    description: Vyhledávání
  - name: io
    description: Vstup a výstup informací
  - name: report
    description: Statistické zprávy
  - name: node
    description: Práce s úrovněmi a uzly
servers:
  - url: http://localhost
    description: Výchozí server
  - url: http://localhost:8080
    description: Devel server
paths:
  /accesspoint:
    delete:
      operationId: AccessPoint_deleteAccessPoints
      description: Invalidation of access points
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccessPointsDetail'
  /accesspoint/{id}:
    delete:
      operationId: AccessPoint_deleteAccessPoint
      description: Invalidation of access point (delete/replace)
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccessPointDetail'
        description: addition for method of invalidation
  /accesspoint/{id}/autoitems:
    get:
      operationId: AccessPoint_getAutoitems
      description: Get invalidated entitiesList of automatically generated elements of the description
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAutoItems'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/copy:
    put:
      operationId: AccessPoint_copyAccessPoint
      description: Copying an archive entity
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityRef'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyAccessPointDetail'
        description: additional copy options
  /accesspoint/{id}/part:
    post:
      operationId: AccessPoint_createPart
      description: Create new part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: accesspoint version
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedPart'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApPartFormVO'
        description: data for creating a part
  /accesspoint/{id}/part/{partId}:
    post:
      operationId: AccessPoint_updatePart
      description: Update a part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: id of part
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: accesspoint version
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApPartFormVO'
        description: data for updating a part
    delete:
      operationId: AccessPoint_deletePart
      description: Delete part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of ApAccessPoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
      tags:
        - accesspoints
  /accesspoint/{id}/part/{partId}/prefer-name:
    put:
      operationId: AccessPoint_setPreferName
      description: Set the preferred name of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of ApAccessPoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
      tags:
        - accesspoints
  /accesspoint/{id}/restore:
    put:
      operationId: AccessPoint_restoreAccessPoint
      description: Restore deleted entity and return to original state
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/revision:
    post:
      operationId: AccessPoint_createRevision
      description: Creating a new revision of access point
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
    delete:
      operationId: AccessPoint_deleteRevision
      description: Deleting a revision of access point
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/revision/autoitems:
    get:
      operationId: AccessPoint_getRevAutoitems
      description: List of automatically generated description elements for revision
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAutoItems'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/revision/merge:
    post:
      operationId: AccessPoint_mergeRevision
      description: Merge ApRevision & ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApStateUpdate'
        description: data for change ApState
  /accesspoint/{id}/revision/part/{partId}:
    delete:
      operationId: AccessPoint_deleteRevisionPart
      description: Delete part of revision of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of revision
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /accesspoint/{id}/revision/part/{partId}/prefer-name:
    put:
      operationId: AccessPoint_setPreferNameRevision
      description: Set the preferred name of revision of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of revision
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
      tags:
        - accesspoints
  /accesspoint/{id}/revision/part/{revPartId}:
    post:
      operationId: AccessPoint_updateRevisionPart
      description: Update a revision part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: revPartId
          in: path
          required: true
          description: id of revision part
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: accesspoint version
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApPartFormVO'
        description: data for updating a part
  /accesspoint/{id}/revision/state:
    put:
      operationId: AccessPoint_changeStateRevision
      description: Change state of revision of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevStateChange'
        description: data for change state of revision of ApAccessPoint
  /accesspoint/{id}/state:
    put:
      operationId: AccessPoint_changeState
      description: Change state of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
      tags:
        - accesspoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApStateUpdate'
        description: data for change ApState
  /accesspoint/{id}/validate:
    get:
      operationId: AccessPoint_validateAccessPoint
      description: Validation of an archive entity
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
        - name: includeRevision
          in: query
          required: false
          description: include revision
          schema:
            type: boolean
            default: false
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApValidationIssues'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - accesspoints
  /search-ap:
    post:
      tags:
        - search
      summary: searches for entity
      operationId: searchEntity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchParams"
        description: search parameters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result_EntityRef"
        "400":
          description: Bad Request, query with incorrect parameters
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /search-arr:
    post:
      tags:
        - search
#        - accesspoints
      summary: searches for entity
      operationId: searchArchDesc
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchParams"
        description: search parameters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result_EntityRef"
        "400":
          description: Bad Request, query with incorrect parameters
        "401":
          description: Unauthorized
        "403":
          description: Forbidden          
  /admin/admin/arrangement/missing-cached-nodes:
    get:
      operationId: Admin_syncNodeCache
      description: Creating missing items in arr_cached_node
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
      tags:
        - admin
  /admin/info:
    get:
      operationId: Admin_info
      description: Return basic statistical info
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInfo'
      tags:
        - admin
  /admin/info/logged-users:
    get:
      operationId: Admin_loggedUsers
      description: Return list of logged users
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedUsers'
      tags:
        - admin
  /admin/user/{userId}/copy-permissions:
    post:
      operationId: Admin_copyPermissions
      description: |-
        Copy user permissions from another user

        Method will append all permissions to given user
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of target user
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
      tags:
        - admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Admin.CopyPermissionParams'
  /daorepository:
    get:
      operationId: DaoRepository_fsRepos
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FsRepo'
  /daos/{id}/change-scenario:
    post:
      operationId: Dao_changeLinkScenario
      description: Changing the dao connection scenario
      parameters:
        - name: id
          in: path
          required: true
          description: dao id
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - daos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
        description: new scenario
  /descItems/{fundVersionId}/create:
    put:
      operationId: DescItem_createDescItem
      description: Create attribute value
      parameters:
        - name: fundVersionId
          in: path
          required: true
          description: id AP version
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDataResult'
      tags:
        - descitems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeItem'
        description: new attribute value
  /descItems/{fundVersionId}/{createNewVersion}/update:
    put:
      operationId: DescItem_updateDescItem
      description: Update attribute value
      parameters:
        - name: fundVersionId
          in: path
          required: true
          description: id AP version
          schema:
            type: integer
        - name: createNewVersion
          in: path
          required: true
          description: create a new version or not?
          schema:
            type: boolean
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDataResult'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - descitems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeItem'
        description: new attribute value
  /extsystem/property:
    get:
      operationId: ExternalSystem_allProperties
      description: Return list of all properties of external system
      parameters:
        - name: extSystemId
          in: query
          required: false
          description: external system id
          schema:
            type: integer
          explode: false
        - name: userId
          in: query
          required: false
          description: user id
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExtSystemProperty'
      tags:
        - externalsystems
    post:
      operationId: ExternalSystem_storeProperties
      description: Store one or more property of external system
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - externalsystems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ExtSystemProperty'
        description: request body
    delete:
      operationId: ExternalSystem_deleteProperties
      description: Delete one property of external system
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - externalsystems
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: integer
        description: external system property id
  /fund:
    post:
      operationId: fund_createFund
      description: Created a new archive file (AS)
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fund'
        '400':
          description: The server could not understand the request due to invalid syntax.
      tags:
        - funds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFund'
    get:
      operationId: fund_findFunds
      description: Search for archive files (AS)
      parameters:
        - name: fulltext
          in: query
          required: false
          description: vyhledávaný výraz
          schema:
            type: string
          explode: false
        - name: institutionIdentifier
          in: query
          required: false
          description: identifikátor instituce (podpora pro kód instituce i UUID přístupového bodu)
          schema:
            type: string
          explode: false
        - name: max
          in: query
          required: false
          description: maximální počet výsledků na stránku
          schema:
            type: integer
            default: 200
          explode: false
        - name: from
          in: query
          required: false
          description: Od kolikátého záznamu se mají výsledky vracet (0 = žádné se nepřeskočí)
          schema:
            type: integer
            default: 0
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindFundsResult'
      tags:
        - funds
  /fund/{fundId}/fsrepo/{fsrepoId}/item-data:
    get:
      operationId: fund_fsRepoItemData
      parameters:
        - $ref: '#/components/parameters/FundIdParameter'
        - $ref: '#/components/parameters/FsRepoIdParameter'
        - name: path
          in: query
          required: true
          description: file path in the repository
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            '*/*':
              schema:
                type: string
                format: binary
      tags:
        - funds
  /fund/{fundId}/fsrepo/{fsrepoId}/items:
    get:
      operationId: fund_fsRepoItems
      parameters:
        - $ref: '#/components/parameters/FundIdParameter'
        - $ref: '#/components/parameters/FsRepoIdParameter'
        - name: filterType
          in: query
          required: false
          description: Optional filter to return only folders or files. If not specified all items are returned
          schema:
            $ref: '#/components/schemas/FsItemType'
          explode: false
        - name: path
          in: query
          required: false
          description: Optional path in the repository
          schema:
            type: string
          explode: false
        - name: lastKey
          in: query
          required: false
          description: Optional parameter to return next batch of items. See FsItems for more details.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FsItems'
      tags:
        - funds
  /fund/{fundId}/fsrepo/{fsrepoId}/linkitem/{nodeId}:
    put:
      operationId: fund_fsCreateDAOLink
