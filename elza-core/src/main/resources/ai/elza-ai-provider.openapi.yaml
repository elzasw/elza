security:
  - SignatureAuth: []
components:
  parameters:
    SignedRequest:
      name: X-AI-Date
      in: header
      required: true
      description: |-
        Request creation time (UTC, ISO 8601 / RFC 3339); part of the signature,
        within ±2 min of server time.
      schema:
        type: string
        format: date-time
  schemas:
    AccountUsageInfo:
      type: object
      required:
        - spentCredits
        - periodStart
      properties:
        accountType:
          type: string
          description: Kind of account, e.g. `personal` or `shared` (open set).
        plan:
          type: string
          description: Plan label, e.g. `basic`; informational.
        allowanceCredits:
          type: number
          format: double
          description: Credit allowance for the current period; absent = no per-account cap.
        spentCredits:
          type: number
          format: double
          description: Credits charged to this account in the current period.
        periodStart:
          type: string
          format: date-time
          description: Start of the current accounting period (UTC).
        periodEnd:
          type: string
          format: date-time
          description: End of the current accounting period — when the allowance resets.
      description: |-
        Credit state of the account the signing key selects — the caller's personal
        account (user-scoped key) or the organization's shared account
        (installation-wide key). All values are provider-computed; the client only
        displays them (typically as relative consumption:
        `spentCredits / allowanceCredits`).
    AiObject:
      type: object
      required:
        - objectType
      properties:
        objectType:
          allOf:
            - $ref: '#/components/schemas/ObjectType'
          description: Selects the payload shape; one of the defined `ObjectType` codes.
      discriminator:
        propertyName: objectType
        mapping:
          elza.text: '#/components/schemas/TextObject'
          elza.markdown: '#/components/schemas/MarkdownObject'
          elza.fundInfo: '#/components/schemas/FundInfoObject'
          elza.archivalEntity: '#/components/schemas/ArchivalEntityObject'
          elza.archivalDescription: '#/components/schemas/ArchivalDescriptionObject'
          elza.revisionFindings: '#/components/schemas/RevisionFindingsObject'
          elza.docCitations: '#/components/schemas/DocCitationsObject'
      description: |-
        A typed object: an `objectType` tag plus the `data` payload for that type. The
        polymorphic carrier for every typed value on the wire — task parameters,
        supplementary context, and results. New concrete types are added as subtypes
        below; a client ignores an object whose `objectType` it does not implement.
    AiServiceInfo:
      type: object
      required:
        - protocolVersion
        - taskTypes
        - profiles
        - limits
      properties:
        protocolVersion:
          type: string
          description: |-
            Protocol version, `major.minor`. Minor grows additively; a major bump (not
            planned) would be a new base path.
        providerName:
          type: string
          description: Human-readable name of the provider/service.
        taskTypes:
          type: array
          items:
            $ref: '#/components/schemas/TaskTypeInfo'
          description: Task types this provider supports.
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ProfileInfo'
          description: Quality/cost tiers this provider offers.
        limits:
          allOf:
            - $ref: '#/components/schemas/Limits'
          description: Operational limits.
      additionalProperties: {}
      description: |-
        Capabilities of this provider. Also serves as the "test connection" call:
        a `200` proves reachability, authentication and an active subscription.
    ArchivalDescription:
      type: object
      required:
        - nodeId
        - items
      properties:
        nodeId:
          type: integer
          format: int32
          description: |-
            Client-local level id (`ArrNode.nodeId`); echo-only — the provider returns
            it (e.g. in findings), never interprets it.
        uuid:
          type: string
          description: Stable level UUID (`ArrNode.uuid`), for durable cross-request identity.
        parentId:
          type: integer
          format: int32
          description: Parent level id (`ArrNode.nodeId`); echo-only, absent at a fund root.
        referenceMark:
          type: array
          items:
            type: string
          description: |-
            Reference designation from the fund root, e.g. `["1", "2", "3"]` — the
            archival "signatura" path.
        depth:
          type: integer
          format: int32
          description: Depth in the arrangement tree; a fund root is depth 0.
        hasChildren:
          type: boolean
          description: Whether the level has child levels (for reasoning about aggregation).
        focus:
          type: boolean
          description: |-
            True for the level the user is on (the "active" level); absent or false for
            supporting levels (ancestors) sent only to give hierarchy. Lets a task tell
            the focus level from its context when several are sent together.
        items:
          type: array
          items:
            $ref: '#/components/schemas/DescriptionItem'
          description: The level's description items, in display order.
      description: |-
        A description unit (level / node): its identity, its place in the arrangement
        and its description items as codes. Self-contained given the accompanying
        `elza.fundInfo`, whose `ruleSetCode` resolves the item codes.
    ArchivalDescriptionObject:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ArchivalDescription'
      allOf:
        - $ref: '#/components/schemas/AiObject'
      description: Archival description object.
    ArchivalEntity:
      type: object
      additionalProperties: {}
      description: |-
        A CAM access point / entity. Payload fields are added as real tasks need them;
        open for additive growth.
    ArchivalEntityObject:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ArchivalEntity'
      allOf:
        - $ref: '#/components/schemas/AiObject'
      description: Archival entity object.
    CustomerUsageInfo:
      type: object
      required:
        - spentCredits
        - periodStart
      properties:
        budgetCredits:
          type: number
          format: double
          description: Subscriber budget for the current period; absent = no cap.
        spentCredits:
          type: number
          format: double
          description: Credits spent by the whole subscriber in the current period.
        periodStart:
          type: string
          format: date-time
          description: Start of the current accounting period (UTC).
      description: Subscriber-level (whole organization) usage state — the outer budget cap.
    DescriptionItem:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          description: Stable item-type code, e.g. `ZP2015_TITLE` (`RulItemType.code`).
        spec:
          type: string
          description: |-
            Stable specification code for enumerated item types, e.g.
            `ZP2015_UNIT_TYPE_UKN` (`RulItemSpec.code`); absent for non-enumerated types.
        value:
          type: string
          description: |-
            The item's value in text form for non-enumerated types; absent when the
            meaning is fully carried by `spec`, or the item is value-less.
      description: |-
        One description item (attribute) of a level, as stable codes plus its value.
        The human-readable names of `type`/`spec` are resolved by the provider from
        the rule-set dictionary (keyed by `FundInfo.ruleSetCode`), not repeated here —
        the codes are the canonical, documented identifiers.
    DocCitation:
      type: object
      required:
        - fragment
      properties:
        fragment:
          type: string
          description: |-
            Stable corpus citation id of the cited section (e.g.
            `zp2015/04-prvky-popisu/ukladaci-jednotka`) — the provider's internal address
            for the section, unique within a corpus version. Always present, even when no
            public URL is known.
        url:
          type: string
          description: |-
            Full web URL of the cited section in the published source document, when the
            provider can resolve one: a deep link to the section where the source exposes
            an anchor, otherwise the document page. Absent when the source has no published
            home or the section could not be located.
        title:
          type: string
          description: Human-readable title of the cited section.
        source:
          type: string
          description: Human-readable name of the source document the section belongs to.
        sourceId:
          type: string
          description: |-
            Id prefix identifying the source document (the part of `fragment` before the
            first `/`, e.g. `zp2015`) — lets a client group citations by source.
      description: |-
        One document citation: a knowledge/documentation section an answer relied on,
        carrying a resolvable web URL when the provider knows one. Distinct from a
        citation of an archival record (a future object type).
    DocCitationsObject:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/DocCitationsPayload'
      allOf:
        - $ref: '#/components/schemas/AiObject'
      description: Document-citations object — the sources an answer relied on.
    DocCitationsPayload:
      type: object
      required:
        - citations
      properties:
        citations:
          type: array
          items:
            $ref: '#/components/schemas/DocCitation'
          description: The cited sections, in the order first referenced by the answer.
      description: Payload of `elza.docCitations`.
    FundInfo:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Fund name (`ArrFund.name`).
        internalCode:
          type: string
          description: Internal (evidence) code of the fund, if set.
        ruleSetCode:
          type: string
          description: |-
            Rule set the fund uses, e.g. `ZP2015` (`RulRuleSet.code`) — selects the
            dictionary that resolves the item-type/spec codes used in
            `elza.archivalDescription`.
        fundNumber:
          type: integer
          format: int32
          description: Fund number, if set.
        mark:
          type: string
          description: Fund mark / signature, if set.
        unitDate:
          type: string
          description: Dating of the fund (free text), if set.
        institution:
          allOf:
            - $ref: '#/components/schemas/InstitutionInfo'
          description: Holding institution.
      description: |-
        Basic descriptive information about an archival fund and its holding
        institution — enough for a task to know which fund it operates within, without
        the full arrangement. Mirrors `ArrFund`.
    FundInfoObject:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/FundInfo'
      allOf:
        - $ref: '#/components/schemas/AiObject'
      description: Fund information object.
    GetItemTypesParams:
      type: object
      required:
        - ruleSetCode
      properties:
        ruleSetCode:
          type: string
          description: Rule set whose item types to return (`RulRuleSet.code`), e.g. `ZP2015`.
      description: Arguments of the `getItemTypes` tool.
    InstitutionInfo:
      type: object
      properties:
        code:
          type: string
          description: Institution code (`ParInstitution.internalCode`).
        name:
          type: string
          description: Institution name — the preferred name of its access point.
      description: Holding archival institution of a fund.
    ItemTypeDictionary:
      type: object
      required:
        - ruleSetCode
        - itemTypes
      properties:
        ruleSetCode:
          type: string
          description: Rule set the dictionary is for; echoes `GetItemTypesParams.ruleSetCode`.
        itemTypes:
          type: array
          items:
            $ref: '#/components/schemas/ItemTypeInfo'
          description: The rule set's item types, resolving the codes used in `elza.archivalDescription`.
      description: Result of the `getItemTypes` tool — the item-type dictionary of one rule set.
    ItemTypeInfo:
      type: object
      required:
        - code
        - name
        - dataType
      properties:
        code:
          type: string
          description: Stable item-type code, e.g. `ZP2015_TITLE` (`RulItemType.code`).
        name:
          type: string
          description: Human-readable name, e.g. `Obsah`.
        dataType:
          type: string
          description: Underlying value type, e.g. `STRING`, `UNITDATE`, `ENUM` (`RulItemType.dataType`).
        specs:
          type: array
          items:
            $ref: '#/components/schemas/ItemTypeSpecInfo'
          description: |-
            Specifications for enumerated item types (`dataType == ENUM`), in display
            order; absent for non-enumerated types.
      description: One item type in the dictionary — the meaning behind a `DescriptionItem.type` code.
    ItemTypeSpecInfo:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          description: Stable spec code, e.g. `ZP2015_UNIT_TYPE_UKN` (`RulItemSpec.code`).
        name:
          type: string
          description: Human-readable name in the rule set's language, e.g. `úřední kniha`.
      description: One specification (enumerated value) of an item type in the dictionary.
    Limits:
      type: object
      properties:
        maxInputBytes:
          type: integer
          format: int64
          description: Maximum size of a serialized `SubmitTask` body, in bytes.
        maxToolResultBytes:
          type: integer
          format: int64
          description: Maximum size of a serialized tool-results body, in bytes.
        maxWaitSeconds:
          type: integer
          format: int32
          description: Maximum accepted `wait` value on task polling, in seconds.
        maxOpenTasks:
          type: integer
          format: int32
          description: Maximum number of a subscriber's tasks in a non-terminal state at once.
        toolResultTimeoutSeconds:
          type: integer
          format: int32
          description: Seconds a task may spend in `awaiting_tools` before failing with `TOOL_TIMEOUT`.
        taskRetentionDays:
          type: integer
          format: int32
          description: |-
            Days a finished task (and its result) stays retrievable. Conversation
            payloads are deleted after this window; only usage/accounting metadata is
            kept longer.
      description: Operational limits of this provider. Advisory for clients; enforced server-side.
    MarkdownObject:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/MarkdownPayload'
      allOf:
        - $ref: '#/components/schemas/AiObject'
      description: Markdown text object — a formatted text block the client renders.
    MarkdownPayload:
      type: object
      required:
        - markdown
      properties:
        markdown:
          type: string
          description: Formatted text as CommonMark + GFM (no raw HTML); the client renders it.
      description: Payload of `elza.markdown`.
    ObjectType:
      type: string
      enum:
        - elza.text
        - elza.markdown
        - elza.fundInfo
        - elza.archivalEntity
        - elza.archivalDescription
        - elza.revisionFindings
        - elza.docCitations
      description: |-
        Object type — names a typed payload defined by this contract. A **closed**,
        namespaced set of string codes modelled as an `enum`, so code generators
        produce a real enumerated type and `AiObject` a clean discriminated union —
        straightforward to emit as OpenAPI and to process on the Java side. The set
        grows additively with a client release, never dynamically. Each code has a
        payload shape defined below, so client and provider generate the *same* model
        from this spec and their representations cannot drift. It is used three ways:
        the discriminator of `AiObject`, a parameter's declared `type` in the task
        catalog (`TaskParameterInfo`), and the result block types a task declares
        (`TaskTypeInfo.resultTypes`). Defined codes:

        - `elza.text` — free text (payload `TextPayload`); the result of `elza.echo`.
        - `elza.markdown` — formatted text (CommonMark + GFM, no raw HTML), a common
        result block the client renders; payload `MarkdownPayload`.
        - `elza.fundInfo` — basic descriptive information about an archival fund and
        its holding institution (payload `FundInfo`); typically supplied as
        `context`.
        - `elza.archivalEntity` — a CAM access point / entity. Payload fields are
        introduced as real tasks need them.
        - `elza.archivalDescription` — a description unit (node) and its related data.
        Payload fields are introduced as real tasks need them.
        - `elza.revisionFindings` — result of `elza.revision`. Payload fields are
        introduced as the task's result shape is finalized.
        - `elza.docCitations` — the knowledge/documentation sources an answer relied on
        (payload `DocCitationsPayload`): each cited section as a stable citation id and,
        when the provider can resolve one, a full web URL. Returned alongside the text
        answer of an assistant-style task. Distinct from citing an archival record,
        which will get its own object type.
    PingResponse:
      type: object
      required:
        - status
        - serverTime
      properties:
        status:
          type: string
          enum:
            - ok
          description: Always `ok` — a `200` with this body proves the endpoint is alive.
        serverTime:
          type: string
          format: date-time
          description: |-
            Current server time (UTC). Compare with the local clock to diagnose
            signature failures caused by clock skew — `X-AI-Date` must be within
            ±2 minutes of this value for signed requests to be accepted.
      description: Liveness probe response.
    ProfileInfo:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: Profile code to pass in `SubmitTask.profile`, e.g. `standard`.
        name:
          type: string
          description: Human-readable name.
        description:
          type: string
          description: What the tier offers (quality, speed, price class).
        default:
          type: boolean
          description: True for the profile used when a submission names none.
      description: A quality/cost tier offered by this provider.
    RevisionFindings:
      type: object
      additionalProperties: {}
      description: |-
        Result of `elza.revision`. Payload fields are added as the task's result shape
        is finalized; open for additive growth.
    RevisionFindingsObject:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/RevisionFindings'
      allOf:
        - $ref: '#/components/schemas/AiObject'
      description: Revision findings object.
    ServiceError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable message.
      description: |-
        Standard error payload. Notable statuses: `402` — no active subscription or
        quota exhausted (the body's `code` distinguishes, e.g. `NO_SUBSCRIPTION`,
        `QUOTA_EXCEEDED` — the subscriber's budget, `ACCOUNT_QUOTA_EXCEEDED` — the
        signing key's account allowance; the set may grow, treat an unknown code
        generically per status); `409` — the operation does not fit the task's
        current state (e.g. tool results for a task not in `awaiting_tools`);
        `429` — rate limited, retry later.
    SignatureAuth:
      type: object
      required:
        - type
        - in
        - name
      properties:
        type:
          type: string
          enum:
            - apiKey
          description: API key authentication
        in:
          type: string
          enum:
            - header
          description: location of the API key
        name:
          type: string
          enum:
            - Authorization
          description: name of the API key
      description: ELZA-AI-HMAC-SHA256 request signature carried in the `Authorization` header (the secret is never sent). See the API description and security.md for the canonical string and KeyId scoping.
    SubmitTask:
      type: object
      required:
        - requestId
        - taskType
        - parameters
      properties:
        requestId:
          type: string
          description: |-
            Client-generated idempotency key (e.g. a UUID). Retrying a failed submit with
            the same `requestId` never creates a second task: the server replies with the
            existing task and `duplicate: true`.
        taskType:
          allOf:
            - $ref: '#/components/schemas/TaskType'
          description: The AI capability requested; selects the provider-side prompt and the price.
        profile:
          type: string
          description: |-
            Quality/cost tier, e.g. `standard`. Available profiles are listed by
            `GET /info`; omitted means the provider's default.
        userInstructions:
          type: string
          description: |-
            Free-form instructions from the *user* (not the integrating application) —
            e.g. the inquiry text, or how content should be reformatted. Composed by the
            provider with its own prompt for the task type.
        parameters:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AiObject'
          description: |-
            The task's declared parameters, keyed by the parameter `name` the provider
            advertises in `TaskTypeInfo.parameters`. Each value is an `AiObject` whose
            `objectType` matches the declared parameter `type`. Every parameter the task
            marks `required` must be present.
        context:
          type: array
          items:
            $ref: '#/components/schemas/AiObject'
          description: |-
            Supplementary context — an open list of typed objects that may improve the
            result (e.g. the archival units the user recently worked with, or the
            `elza.fundInfo` of the fund in scope). Not part of the task's declared
            parameters; the provider uses what it understands and ignores the rest.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/ToolDefinition'
          description: |-
            Tools the client offers for this task. If present, the task may enter
            `awaiting_tools` and request calls; if absent, the task runs on `parameters`
            (and `context`) alone.
        parentTaskId:
          type: string
          description: |-
            Id of a finished task whose conversation this task continues (a follow-up /
            refinement). The provider restores that task's context server-side; the
            client does not re-send it. The parent must belong to the same subscriber
            and be within the retention window.
        metadata:
          allOf:
            - $ref: '#/components/schemas/TaskMetadata'
          description: Audit/attribution facts about the task; not task data (see `parameters` and `context`).
      description: Task submission.
    Task:
      type: object
      required:
        - taskId
        - requestId
        - taskType
        - state
        - createdAt
      properties:
        taskId:
          type: string
          description: Server-assigned task id (opaque).
        requestId:
          type: string
          description: The client's idempotency key from the submission.
        taskType:
          allOf:
            - $ref: '#/components/schemas/TaskType'
          description: Requested capability.
        state:
          allOf:
            - $ref: '#/components/schemas/TaskState'
          description: Current state. Unknown values must be treated as "in progress".
        createdAt:
          type: string
          format: date-time
          description: When the task was accepted.
        startedAt:
          type: string
          format: date-time
          description: When processing began (absent while `queued`).
        finishedAt:
          type: string
          format: date-time
          description: When the task reached a terminal state.
        progress:
          allOf:
            - $ref: '#/components/schemas/TaskProgress'
          description: Advisory progress for user display.
        toolCalls:
          type: array
          items:
            $ref: '#/components/schemas/ToolCall'
          description: |-
            Pending tool calls; present exactly while `awaiting_tools`. Answer all of
            them in one `POST …/tool-results`.
        output:
          type: array
          items:
            $ref: '#/components/schemas/AiObject'
          description: |-
            The result; present when `done`. An ordered list of typed blocks — the task
            type fixes which block types may appear (`TaskTypeInfo.resultTypes`), not the
            caller. Each block's `data` conforms to its `objectType`'s payload shape,
            guaranteed by the server.
        error:
          allOf:
            - $ref: '#/components/schemas/TaskError'
          description: Failure description; present when `error`.
        promptVersion:
          type: string
          description: |-
            Version of the provider-side prompt used, e.g. `elza.revision/2026-07-02.1`.
            Record it with the task's results: it is needed to reproduce, audit, and to
            correlate result-quality feedback with prompt changes.
        usage:
          allOf:
            - $ref: '#/components/schemas/Usage'
          description: Metered usage so far (running totals; final once the state is terminal).
      description: A task and its current state — the poll response.
    TaskAccepted:
      type: object
      required:
        - taskId
        - state
      properties:
        taskId:
          type: string
          description: Id of the task (new, or pre-existing on an idempotent retry).
        state:
          allOf:
            - $ref: '#/components/schemas/TaskState'
          description: Initial state (normally `queued`).
        duplicate:
          type: boolean
          description: True if this `requestId` was already seen for the subscriber (idempotent retry, no new task).
      description: The task was accepted (newly created, or recognised as an idempotent retry).
    TaskError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |-
            Machine-readable code. Defined codes (the set may grow): `MODEL_ERROR`
            (upstream model failure after retries), `SCHEMA_ERROR` (model could not
            produce output conforming to the task's declared result types), `TOOL_TIMEOUT` (client did
            not return tool results in time), `INPUT_TOO_LARGE`, `UNSUPPORTED_TASK_TYPE`,
            `INTERNAL`.
        message:
          type: string
          description: Human-readable message.
      description: Failure description of a task in state `error`.
    TaskMetadata:
      type: object
      properties:
        instanceName:
          type: string
          description: Identifier of the client instance the task originates from, e.g. `PROD`.
        app:
          type: string
          description: Originating application, e.g. `elza`.
        appVersion:
          type: string
          description: Application version, e.g. `3.5.0`.
        requestedBy:
          type: string
          description: |-
            User on whose behalf the task runs (e.g. the Elza username), for audit and
            attribution when the signing key is installation-wide. With a user-scoped
            key this should match the key's user.
      description: |-
        Audit/attribution facts about a task — who ran it and from which application.
        Not interpreted by the AI and not task data (the data travels in `parameters`
        and `context`); used only for the provider's support and usage reporting.
    TaskParameterInfo:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]*$
          description: Parameter name, unique within the task (the key under `SubmitTask.parameters`).
        type:
          allOf:
            - $ref: '#/components/schemas/ObjectType'
          description: The parameter's object type (an `ObjectType` code).
        description:
          type: string
          description: Human-readable description for the client UI.
        required:
          type: boolean
          description: |-
            Whether the caller must supply it. A task cannot be invoked unless all its
            required parameters are present.
      description: |-
        A typed parameter a task type declares in the catalog. Names one of the task's
        inputs and the `ObjectType` its value must have; the client supplies it under
        this `name` in `SubmitTask.parameters`.
    TaskProgress:
      type: object
      properties:
        message:
          type: string
          description: Short human-readable status, suitable for direct display.
        percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Rough completion estimate, 0–100.
      description: |-
        Progress signal for the user while the task runs. Best-effort and advisory —
        a client must not depend on any particular granularity.
    TaskState:
      type: string
      enum:
        - queued
        - running
        - awaiting_tools
        - done
        - error
        - cancelled
      description: |-
        State of a task. Terminal states are `done`, `error`, `cancelled`. The set may
        grow additively; a client must treat an unknown state as "in progress" and
        keep polling.
    TaskType:
      type: string
      description: |-
        Task type — names the AI capability requested and selects the provider-side
        prompt; also the provider's unit of metering/pricing. An **open** set of
        string codes (a plain string on the wire, so code generators produce a
        simple type): new types are added without a contract change, and a provider
        advertises the types it supports via `GET /info`. Namespaced by client
        product (`elza.…`). Defined types:

        - `elza.echo` — integration-test task: echoes the submitted `userInstructions`
        back as an `elza.text` result; declares no parameters. No archival semantics —
        exists so both sides can validate the full protocol loop (auth, submit, poll,
        typed output, usage metering) cheaply before any real scenario.
        - `elza.revision` — advisory revision of archival description units: finds
        logical inconsistencies, dating mismatches, terminology problems and other
        issues that formal (rule-based) validation cannot catch. Read-only;
        findings are returned as `elza.revisionFindings`. The first production
        scenario.
    TaskTypeInfo:
      type: object
      required:
        - code
      properties:
        code:
          type: string
          description: The task type code, e.g. `elza.revision`.
        name:
          type: string
          description: Human-readable name.
        description:
          type: string
          description: What the task does.
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/TaskParameterInfo'
          description: |-
            The typed parameters this task declares. A client can offer the task only if
            its build implements every parameter `type` (and every `resultTypes` entry),
            and only when it can supply the parameters the task marks `required`.
        resultTypes:
          type: array
          items:
            $ref: '#/components/schemas/ObjectType'
          description: |-
            The object types the task's result may contain — an ordered set of output
            blocks (e.g. a text summary plus a structured findings object). Fixed by the
            task, not chosen by the caller; the client must be able to handle each type.
      description: A task type supported by this provider.
    TextObject:
      type: object
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/TextPayload'
      allOf:
        - $ref: '#/components/schemas/AiObject'
      description: Free text object.
    TextPayload:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The text.
      description: Payload of `elza.text`.
    ToolCall:
      type: object
      required:
        - callId
        - tool
        - arguments
      properties:
        callId:
          type: string
          description: Server-assigned id of this call; echo it back in the matching `ToolResult`.
        tool:
          type: string
          description: Name of the tool to execute (one of the task's declared tools).
        arguments:
          description: Arguments object; conforms to the tool's declared `inputSchema`.
      description: A pending call of a client-declared tool (present while `awaiting_tools`).
    ToolDefinition:
      type: object
      required:
        - name
        - description
        - inputSchema
      properties:
        name:
          type: string
          pattern: ^[A-Za-z][A-Za-z0-9_]*$
          description: Tool name, unique within the task, e.g. `searchNodes`.
        description:
          type: string
          description: What the tool does and when to use it — written for the model.
        inputSchema:
          type: object
          additionalProperties: {}
          description: JSON Schema of the tool's arguments object.
      description: |-
        A tool the client offers for this task — something the *client* can execute
        locally on the provider's request (a search over the client's index, a record
        lookup, …). Mirrors the tool-definition shape of AI model APIs.
    ToolResult:
      type: object
      required:
        - callId
      properties:
        callId:
          type: string
          description: '`callId` of the `ToolCall` this answers.'
        result:
          description: Tool output (any JSON).
        error:
          type: string
          description: Human-readable failure description when the tool could not be executed.
      description: The client's answer to one `ToolCall`. Exactly one of `result` / `error` is present.
    Usage:
      type: object
      required:
        - inputTokens
        - outputTokens
        - costUnits
      properties:
        inputTokens:
          type: integer
          format: int64
          description: Model input tokens consumed (informative).
        outputTokens:
          type: integer
          format: int64
          description: Model output tokens produced (informative).
        costUnits:
          type: number
          format: double
          description: Billable cost units per the provider's price list.
        chargedCredits:
          type: number
          format: double
          description: |-
            Credits charged to the caller's account for this task, when the provider
            bills in credits: `costUnits × account multiplier` (a shared/organization
            account may burn credits faster than a personal one). Absent when the
            provider does not use credit accounting.
      description: |-
        Metered usage of a task so far — running totals, present from the first model
        call onward (also on failed tasks: incurred usage counts). `costUnits` is the
        billable quantity: a model-independent unit defined by the provider's price
        list, so model changes on the provider side never change the unit the
        subscriber sees.
    UsageInfo:
      type: object
      properties:
        account:
          allOf:
            - $ref: '#/components/schemas/AccountUsageInfo'
          description: Credit state of the account the signing key selects.
        customer:
          allOf:
            - $ref: '#/components/schemas/CustomerUsageInfo'
          description: Subscriber-level usage state (the outer cap).
      additionalProperties: {}
      description: |-
        The caller's usage/credit balance — the data behind "how much have I spent".
        Served from the same (cached) state the provider's submit-time budget check
        uses, so the displayed balance never disagrees with a `402` refusal. Both
        members are optional: a provider without credit accounting may return an
        empty object (a `200` still proves auth + subscription).
  securitySchemes:
    SignatureAuth:
      type: apiKey
      in: header
      name: Authorization
      description: ELZA-AI-HMAC-SHA256 request signature carried in the `Authorization` header (the secret is never sent). See the API description and security.md for the canonical string and KeyId scoping.
servers:
  - url: '{endpoint}'
    description: Provider-assigned base endpoint, e.g. https://ai.example.com/elza
    variables:
      endpoint:
        default: ''
        description: Base URL the provider assigned to the subscriber; may embed the provider's own account routing.
