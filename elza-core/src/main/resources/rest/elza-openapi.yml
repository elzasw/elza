components:
  parameters:
    AipIdParameter:
      name: aipId
      in: path
      required: true
      description: Aip ID
      schema:
        type: integer
    FsRepoIdParameter:
      name: fsrepoId
      in: path
      required: true
      description: FileSystem repository ID
      schema:
        type: integer
    FundIdParameter:
      name: fundId
      in: path
      required: true
      description: Fund ID
      schema:
        type: integer
    FundVersionIdParameter:
      name: fundVersionId
      in: path
      required: true
      description: Fund ID Version
      schema:
        type: integer
    NodeIdParameter:
      name: nodeId
      in: path
      required: true
      description: Node ID
      schema:
        type: integer
  schemas:
    Admin.CopyPermissionParams:
      type: object
      required:
        - fromUserId
      properties:
        fromUserId:
          type: integer
    AdminInfo:
      type: object
      required:
        - funds
        - levels
        - accessPoints
        - users
        - loggedUsers
      properties:
        funds:
          type: integer
          format: int32
          description: Number of funds
        levels:
          type: integer
          format: int32
          description: Number of valid levels
        accessPoints:
          type: integer
          format: int32
          description: Number of valid access points
        users:
          type: integer
          format: int32
          description: Number of users
        loggedUsers:
          type: integer
          format: int32
          description: Number of logged users
      description: Basic statistics about Elza instance
    AipDetailFilteredResult:
      type: object
      required:
        - count
        - rows
      properties:
        count:
          type: integer
          description: Počet výsledků
        rows:
          type: array
          items:
            $ref: '#/components/schemas/AipDetailVO'
          description: Seznam objektů
    AipDetailVO:
      type: object
      required:
        - aipId
        - code
        - digitalRepositoryId
        - aipVersion
        - fund
        - institution
        - originatorInstitution
        - originator
        - unitdateFrom
        - unitdateTo
        - institutionCode
        - ingestionCode
        - referenceNumber
        - nadChangeCode
        - aipSize
        - metadataLoad
        - comleteAipLoad
        - metadataError
        - metadataErrorException
        - aipVersionMetadata
        - importState
        - exportState
        - linkedNodes
      properties:
        aipId:
          type: integer
          description: Id AIPu
        code:
          type: string
          description: Kód AIPu
        digitalRepositoryId:
          type: integer
          description: Id digitálního repozitáře
        aipVersion:
          type: string
          description: Verze AIPu
        fund:
          allOf:
            - $ref: '#/components/schemas/ArrFundGen'
          description: Archivní soubor
        institution:
          allOf:
            - $ref: '#/components/schemas/ParInstitutionGen'
          description: Instituce
        originatorInstitution:
          allOf:
            - $ref: '#/components/schemas/ParInstitutionGen'
          description: Instituce původce
        originator:
          type: string
          description: Původce
        unitdateFrom:
          type: string
          description: Datace od
        unitdateTo:
          type: string
          description: Datace do
        institutionCode:
          type: string
          description: Kód instituce
        ingestionCode:
          type: string
          description: Číslo příjemky
        referenceNumber:
          type: string
          description: Číslo jednací příjemky ve spisovce
        nadChangeCode:
          type: string
          description: Identifikátor vnější změny NAD v PEvA
        aipSize:
          type: integer
          description: Velikost AIPu v bytech
        metadataLoad:
          type: boolean
          description: Příznak načtených metadat
        comleteAipLoad:
          type: boolean
          description: Příznak načteného kompletního AIPu
        metadataError:
          type: boolean
          description: Příznak chyby při načítání metadat
        metadataErrorException:
          type: string
          description: Chyby při načítání metadat
        aipVersionMetadata:
          type: string
          description: Verze AIPu s načtenými metadaty
        importState:
          allOf:
            - $ref: '#/components/schemas/QueueItemState'
          description: Stav importu
        exportState:
          allOf:
            - $ref: '#/components/schemas/QueueItemState'
          description: Stav exportu
        linkedNodes:
          type: array
          items:
            $ref: '#/components/schemas/LinkedNodeVO'
          description: Seznam napojených nodes
      description: Vo pro detail AIPu
    AipFilterGen:
      type: object
      required:
        - id
        - attr
        - value
        - criteria
        - path
      properties:
        id:
          type: string
          description: UUID filtru
        attr:
          type: string
          description: Atribut, podle kterého chceme filtrovat
        value:
          type: string
          description: filtrovaná hodnota
        criteria:
          allOf:
            - $ref: '#/components/schemas/AipFilterCriteriaGen'
          description: Způsob porovnání
        from:
          type: string
          description: Hodnota od
        to:
          type: string
          description: Hodnota do
        path:
          type: string
          description: Cesta
      description: Filter aipu
    AipFilterCriteriaGen:
      type: string
      enum:
        - IS_NULL
        - IS_NOT_NULL
        - CONTAINS
        - DOES_NOT_CONTAIN
        - EQUALS
        - BETWEEN
      description: Způsob porovnání hodnot filtru
    AipType:
      type: string
      enum:
        - PACKAGE_INFO
        - ARCHDESC
        - METADATA_BASE
        - AIP_BASE
        - AIP_RAW
      description: Aip package type
    AipUpdateType:
      type: string
      enum:
        - DB_UPDATE
        - DOWNLOAD_UPDATE
        - FORCE_UPDATE
      description: AIP update type
    ApState:
      type: string
      enum:
        - OK
        - ERROR
        - TEMP
        - INIT
      description: Stav rejstříku
    ApStateApproval:
      type: string
      enum:
        - NEW
        - TO_APPROVE
        - APPROVED
        - TO_AMEND
      description: States of ApState
    ApStateUpdate:
      type: object
      required:
        - stateApproval
      properties:
        typeId:
          type: integer
          description: id of type
        scopeId:
          type: integer
          description: id of scope
        comment:
          type: string
          description: comment
        stateApproval:
          allOf:
            - $ref: '#/components/schemas/ApStateApproval'
          description: state of ApState
      description: Data for changing state of ApAccessPoint
    ArrFundGen:
      type: object
      required:
        - id
        - name
        - internalCode
        - fundNumber
        - mark
        - createDate
        - institutionId
        - unitdate
      properties:
        id:
          type: integer
          description: Identifikátor
        name:
          type: string
          description: Název
        internalCode:
          type: string
          description: Kód
        fundNumber:
          type: integer
          description: Číslo
        mark:
          type: string
          description: Značka
        createDate:
          type: string
          description: Datum vytvoření
        institutionId:
          type: integer
          description: ID instituce archivního souboru
        unitdate:
          type: string
          description: Unitdate
      description: Archivní soubor
    AutoValue:
      type: object
      properties:
        itemTypeId:
          type: integer
          description: identifier of the type of the description element
        itemSpecId:
          type: integer
          description: identifier of the specification of the description element
        value:
          type: string
          description: value of the element
      description: Automatically generated elements of the description
    BaseCode:
      type: object
      required:
        - id
        - code
        - name
      properties:
        id:
          type: integer
          description: Identifikátor
        code:
          type: string
          description: Kód
        name:
          type: string
          description: Název
      description: Souhrný model pro enumy
    BaseException:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
        code:
          type: string
        message:
          type: string
        level:
          type: string
        properties:
          type: object
          additionalProperties:
            type: object
        stackTrace:
          type: string
      description: Error specification for the client
    ChangeType:
      type: string
      enum:
        - NEW
        - UPDATED
        - DELETED
        - ORIGINAL
      description: Type of change Item
    CopyAccessPointDetail:
      type: object
      required:
        - scope
      properties:
        scope:
          type: string
          description: code of scope or id
        replace:
          type: boolean
          description: if the original AP should be replaced
        skipItems:
          type: array
          items:
            type: integer
          description: list of description element IDs not to copy
      description: Additional copy options
    DeleteAccessPointDetail:
      type: object
      properties:
        replacedBy:
          type: string
          description: Id of the entity being replaced
        replaceType:
          allOf:
            - $ref: '#/components/schemas/ReplaceType'
          description: method of replacing
      description: Data for detele/replace ApAccessPoint
    EntityRef:
      type: object
      required:
        - id
