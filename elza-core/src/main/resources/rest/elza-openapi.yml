openapi: 3.0.2
info:
  title: ELZA API
  version: 1.0.0
tags:
  - name: admin
    description: Administrativní funkce
  - name: externalsystems
    description: Externí systémy
  - name: funds
    description: Archivní soubory
  - name: accesspoints
    description: Přístupové body a archivní entity
  - name: search
    description: Vyhledávání
  - name: io
    description: Vstup a výstup informací
  - name: aips
servers:
  - url: http://localhost
    description: Výchozí server
  - url: http://localhost:8080
    description: Devel server
paths:
  /fund:
    post:
      summary: Založené nového archivního souboru
      operationId: createFund
      tags:
        - funds
      requestBody:
        description: Data pro založení
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/CreateFund'
      responses:
        200:
          description: Úspěšné založení archivního souboru
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/Fund'
        400:
          description: Neplatné údaje pro založení AS
    get:
      summary: Vyhledání archivních souborů
      operationId: findFunds
      tags:
        - funds
      parameters:
        - name: fulltext
          description: Vyhledávaný výraz
          in: query
          required: false
          schema:
            type: string
        - name: institutionIdentifier
          description: Identifikátor instituce (podpora pro kód instituce i UUID přístupového bodu)
          in: query
          required: false
          schema:
            type: string
        - name: max
          description: Maximální počet výsledků na stránku
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 200
        - name: from
          description: Od kolikátého záznamu se mají výsledky vracet (0 = žádné se nepřeskočí)
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
      responses:
        200:
          description: Výsledek hledání AS
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/FindFundsResult'
  /fund/{id}:
    get:
      summary: Získání detailu AS
      operationId: getFund
      tags:
        - funds
      parameters:
        - name: id
          description: Identifikátor AS
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Detail AS
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/FundDetail'
        404:
          description: AS neexistuje
    put:
      summary: Změna AS
      operationId: updateFund
      tags:
        - funds
      parameters:
        - name: id
          description: Identifikátor AS
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Data pro založení
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/UpdateFund'
      responses:
        200:
          description: Detail AS
          content:
            'application/json':
              schema:
                $ref: '#/components/schemas/FundDetail'
        400:
          description: Neplatné údaje pro úpravu AS
        404:
          description: AS neexistuje
  /fund/{id}/import:
    put:
      summary: Import additional data to the existing fund.
      operationId: importFundData
      tags:
        - funds
      parameters:
        - name: id
          description: Fund ID. Might be ID or fund UUID.
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Doplnění způsobu importu
        content:
          'multipart/form-data':
            schema:
              $ref: '#/components/schemas/ImportFundData'
      responses:
        200:
          description: Potvrzení o úspěšném importu
        404:
          description: Fund neexistuje
        406:
          description: Chybný formát vstupního souboru
  /fund/{id}/structuredObject:
    delete:
      summary: Smazání seznamu hodnot strukturovaného datového typu
      operationId: deleteStructureData
      tags:
        - funds
      parameters:
        - name: id
          description: Identifikátor AS
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: Seznam id hodnot strukturovaného datového typu
        content:
          'application/json':
            schema:
              type: array
              items:
                type: integer
      responses:
        200:
          description: Seznam smazaných id hodnot strukturovaného datového typu
          content:
            application/json:
              schema:
                type: array
                items:
                  type: integer
  /accesspoint/{id}:
    delete:
      tags:
        - accesspoints
      operationId: AccessPoint_deleteAccessPoint
      description: Invalidation of ApAccessPoint (delete/replace)
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      requestBody:
        description: addition for method of invalidation
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccessPointDetail'
  /accesspoint/{id}/autoitems:
    get:
      tags:
        - accesspoints
      operationId: AccessPoint_getAutoitems
      description: List of automatically generated elements of the description
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultAutoItems'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
  /accesspoints/{id}/copy:
    put:
      tags:
        - accesspoints
      operationId: copyAccessPoint
      description: Copying an archive entity
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityRef'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      requestBody:
        description: additional copy options
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyAccessPointDetail'
  /accesspoint/{id}/part/{partId}:
    delete:
      tags:
        - accesspoints
      operationId: AccessPoint_deletePart
      description: Delete part of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of ApAccessPoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        404:
          description: AP neexistuje
  /accesspoint/{id}/part/{partId}/prefer-name:
    put:
      tags:
        - accesspoints
      operationId: AccessPoint_setPreferName
      description: Set the preferred name of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of ApAccessPoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
  /accesspoint/{id}/revision/merge:
    post:
      tags:
        - accesspoints
      operationId: AccessPoint_mergeRevision
      description: Merge ApRevision & ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
      requestBody:
        description: data for change ApState
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApStateUpdate'
  /accesspoint/{id}/revision/part/{partId}:
    delete:
      tags:
        - accesspoints
      operationId: AccessPoint_deleteRevisionPart
      description: Delete part of revision of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of revision
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
  /accesspoint/{id}/revision/part/{partId}/prefer-name:
    put:
      tags:
        - accesspoints
      operationId: AccessPoint_setPreferNameRevision
      description: Set the preferred name of revision of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: partId
          in: path
          required: true
          description: partId of revision
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        404:
          description: AP nebo revize neexistuje
  /accesspoint/{id}/revision/state:
    put:
      tags:
        - accesspoints
      operationId: AccessPoint_changeStateRevision
      description: Change state of revision of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
        404:
          description: AP nebo revize neexistuje
      requestBody:
        description: data for change state of revision of ApAccessPoint
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevStateChange'
  /accesspoint/{id}/state:
    put:
      tags:
        - accesspoints
      operationId: AccessPoint_changeState
      description: Change state of ApAccessPoint
      parameters:
        - name: id
          in: path
          required: true
          description: id of accesspoint
          schema:
            type: integer
        - name: apVersion
          in: query
          required: false
          description: actual version of ApAccessPoint
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: integer
      requestBody:
        description: data for change ApState
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApStateUpdate'
  /accesspoints/{id}/restore:
    put:
      summary: Obnovení neplatné entity a návrat do původního stavu
      operationId: restoreAccessPoint
      tags:
        - accesspoints
      parameters:
        - name: id
          description: Identifikátor archivní entity
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Entita byla obnovena
        404:
          description: AP neexistuje
  /accesspoints/{id}/validate:
    put:
      summary: Ověřování entity
      operationId: validateAccessPoint
      tags:
        - accesspoints
      parameters:
        - name: id
          description: Identifikátor archivní entity
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Entita byla ověřena
        404:
          description: AP neexistuje
  /accesspoints:
    delete:
      summary: Zneplatnění přístupovych bodu
      operationId: deleteAccessPoints
      tags:
        - accesspoints
      requestBody:
        description: Seznam přístupových bodů
        content:
          'application/json':
            schema:
              $ref: '#/components/schemas/DeleteAccessPointsDetail'
      responses:
        200:
          description: Potvrzení o úspěšném odstranění
        404:
          description: AP neexistuje
  /revision/{id}:
    post:
      summary: Vytvoření nové revize přístupového bodu
      operationId: createRevision
      tags:
        - accesspoints
      parameters:
        - name: id
          description: Identifikátor archivní entity
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: Potvrzení o úspěšném založení
        404:
          description: AP neexistuje
    delete:
      summary: Smazání revize přístupového bodu
      operationId: deleteRevision
      tags:
        - accesspoints
      parameters:
        - name: id
          description: Identifikátor archivní entity
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: Potvrzení o úspěšném smazání
        404:
          description: AP nebo revize neexistuje
  /revision/{id}/autoitems:
    get:
      summary: Vrátí seznam automaticky generovaných prvků popisu pro revizi
      operationId: getRevAutoitems
      tags:
        - accesspoints
      parameters:
        - name: id
          description: Identifikátor archivní entity
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Seznam navržených prvků popisu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultAutoItems"
        404:
          description: AP neexistuje
  /daos/{id}/change-scenario:
    post:
      summary: Změna scénáře napojení dao
      operationId: changeLinkScenario
      tags:
        - daos
      parameters:
        - name: id
          description: Identifikátor dao
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        description: Nový scénář
        required: true
        content:
          'application/json':
            schema:
              type: string
      responses:
        200:
          description: Změna scénáře provedena
        404:
          description: Dao neexistuje
  /search-ap:
    post:
      tags:
        - search
      summary: searches for entity
      operationId: searchEntity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchParams"
        description: search parameters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result_EntityRef"
        "400":
          description: Bad Request, query with incorrect parameters
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /search-arr:
    post:
      tags:
        - search
#        - accesspoints
      summary: searches for entity
      operationId: searchArchDesc
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchParams"
        description: search parameters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result_EntityRef"
        "400":
          description: Bad Request, query with incorrect parameters
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /admin/admin/arrangement/missing-cached-nodes:
    get:
      tags:
        - admin
      operationId: Admin_syncNodeCache
      description: Creating missing items in arr_cached_node
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
  /admin/info:
    get:
      tags:
        - admin
      operationId: Admin_info
      description: Return basic statistical info
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInfo'
  /admin/info/logged-users:
    get:
      tags:
        - admin
      operationId: Admin_loggedUsers
      description: Return list of logged users
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggedUsers'
  /admin/user/{userId}/copy-permissions:
    post:
      tags:
        - admin
      operationId: Admin_copyPermissions
      description: |-
        Copy user permissions from another user

        Method will append all permissions to given user
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of target user
          schema:
            type: integer
      responses:
        '200':
          description: The request has succeeded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Admin.CopyPermissionParams'
  /aip/bulk-connect-logic-to-jp:
    post:
      operationId: Aip_bulkConnectLogicToJp
      description: Bulk connect logical structure to JP
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipIdList
          in: query
          required: true
          description: DaAip ID list
          schema:
            type: array
            items:
              type: integer
          explode: false
        - name: daLevelViewId
          in: query
          required: true
          description: DaLevelView ID
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aips
  /aip/bulk-connect-to-jp:
    post:
      operationId: Aip_bulkConnectToJp
      description: Bulk connect to JP
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipIdList
          in: query
          required: true
          description: DaAip ID list
          schema:
            type: array
            items:
              type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aips
  /aip/bulk-create-from-selected:
    post:
      operationId: Aip_bulkCreateFromSelected
      description: Bulk create from selected
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipIdList
          in: query
          required: true
          description: DaAip ID list
          schema:
            type: array
            items:
              type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aips
  /aip/bulk-create-selected-to-jp:
    post:
      operationId: Aip_bulkCreateSelectedToJp
      description: Bulk create from selected and connect to JP
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipIdList
          in: query
          required: true
          description: DaAip ID list
          schema:
            type: array
            items:
              type: integer
          explode: false
        - name: daLevelViewId
          in: query
          required: true
          description: DaLevelView ID
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aips
  /aip/connect-jp-from-selected:
    post:
      operationId: Aip_connectJpFromSelected
      description: Create JP from selected
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipId
          in: query
          required: true
          description: DaAip ID
          schema:
            type: integer
          explode: false
        - name: daDaoId
          in: query
          required: true
          description: DaDao ID
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aips
  /aip/connect-jp-link-from-selected:
    post:
      operationId: Aip_connectJpLinkFromSelected
      description: Create JP and link from selected
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipId
          in: query
          required: true
          description: DaAip ID
          schema:
            type: integer
          explode: false
        - name: daDaoId
          in: query
          required: true
          description: DaDao ID
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aips
  /aip/connect-part-to-jp:
    post:
      operationId: Aip_connectPartToJp
      description: Connect Part to JP
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipId
          in: query
          required: true
          description: DaAip ID
          schema:
            type: integer
          explode: false
        - name: daDaoId
          in: query
          required: true
          description: DaDao ID
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aips
  /aip/connect-selected-to-jp:
    post:
      operationId: Aip_connectSelectedToJp
      description: Connect selected to JP
      parameters:
        - name: arrNodeId
          in: query
          required: true
          description: ArrNode ID
          schema:
            type: integer
          explode: false
        - name: daAipId
          in: query
          required: true
          description: DaAip ID
          schema:
            type: integer
          explode: false
      responses:
        '200':
          description: The request has succeeded.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseException'
      tags:
        - aips
  /aip/connect-to-jp:
    post:
      operationId: Aip_connectToJp
      description: Connect to JP
